<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fdf2e9">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Show Up</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg: #fdf2e9;
    --bg2: #fff8f0;
    --bg3: #faead8;
    --border: #e8d5b5;
    --text: #3a1f0a;
    --muted: #8b6f4f;
    --primary: #c2410c;
    --primary-hover: #9a3412;
    --resting: #ea580c;
    --danger: #991b1b;
  }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }

  /* ───── HOME ───── */
  #page-home {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background: #0c0c0c;
  }
  .home-backdrop {
    position: absolute; inset: 0;
    background: url('jiduola.png') center/cover no-repeat;
    filter: blur(40px) brightness(0.4) saturate(1.2);
    transform: scale(1.2);
    z-index: 0; pointer-events: none;
  }
  .home-title {
    position: relative; z-index: 2;
    font-size: clamp(28px, 7vw, 44px);
    font-weight: 800; letter-spacing: 0.18em;
    color: #d4a843;
    text-shadow: 0 2px 16px rgba(0,0,0,0.7);
    padding-top: max(28px, env(safe-area-inset-top));
  }
  .home-main {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    gap: 14px;
  }
  .home-img-wrap {
    position: relative; z-index: 1;
    display: inline-block; max-width: 100vw;
  }
  .lang-toggle {
    padding: 6px 16px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(212,168,67,0.55);
    border-radius: 999px;
    color: #d4a843;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }
  .home-spacer {
    height: max(28px, env(safe-area-inset-bottom));
  }
  #home-img {
    max-width: 100%;
    max-height: calc(100dvh - 160px);
    object-fit: contain;
    display: block;
    pointer-events: none;
    user-select: none;
    -webkit-mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0,0,0,0.3) 3%,
      #000 10%,
      #000 88%,
      rgba(0,0,0,0.3) 96%,
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(0,0,0,0.3) 3%,
      #000 10%,
      #000 88%,
      rgba(0,0,0,0.3) 96%,
      transparent 100%
    );
  }
  .head-btn {
    position: absolute;
    background: transparent;
    border: none;
    cursor: pointer;
    outline: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* ───── WORKOUT ───── */
  #page-workout {
    display: none;
    min-height: 100dvh;
    background: var(--bg);
    padding-bottom: 120px;
  }

  /* Header */
  #workout-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    gap: 12px;
  }
  #btn-back {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    touch-action: manipulation;
  }
  #workout-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.02em;
    flex: 1;
    text-align: center;
  }
  #global-timer {
    font-size: 16px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
    color: var(--primary);
    font-weight: 600;
    flex-shrink: 0;
    min-width: 80px;
    text-align: right;
  }

  /* Exercise card */
  .exercise-card {
    margin: 16px 12px 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .exercise-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    gap: 8px;
  }
  .exercise-name {
    font-size: 15px;
    font-weight: 600;
    flex: 1;
    min-width: 0;
  }
  .exercise-sets-count {
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }
  .edit-hint {
    font-size: 11px;
    color: var(--muted);
    opacity: 0.65;
    white-space: nowrap;
  }

  /* Table */
  .sets-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .sets-table th {
    padding: 8px 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    text-align: center;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .sets-table th:first-child { width: 30px; }
  .sets-table th:nth-child(2), .sets-table th:nth-child(3) { width: 60px; }
  .sets-table th:nth-child(4) { width: 72px; }
  .sets-table th:last-child { width: 108px; }

  .sets-table td {
    padding: 8px 4px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  .sets-table tr:last-child td { border-bottom: none; }

  .set-row { transition: background 0.2s; }
  .set-row.completed { opacity: 0.45; }
  .set-row.current { background: var(--bg3); }
  .set-row.resting { background: rgba(234, 88, 12, 0.10); }
  .set-row.pending { opacity: 0.5; }

  .cell-num { color: var(--muted); font-size: 13px; }

  /* Read-only cell: tap feedback, no border */
  .cell-readonly {
    display: inline-block;
    min-width: 36px;
    padding: 4px 8px;
    cursor: pointer;
    border-radius: 4px;
    font-size: 14px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .cell-readonly:active { background: var(--bg3); }

  /* Reps behind frosted glass: blurred placeholder digits; the current row is already --bg3, so a translucent tint */
  .cell-masked,
  .cell-masked:active {
    color: transparent;
    text-shadow: 0 0 8px var(--muted);
    background: rgba(139, 111, 79, 0.14);
    border-radius: 6px;
  }

  /* Active editing input */
  .cell-edit-input {
    background: var(--bg2);
    border: 1.5px solid var(--primary);
    border-radius: 4px;
    padding: 4px 6px;
    text-align: center;
    font-size: 14px;
    width: 60px;
    outline: none;
    color: var(--text);
    font-family: inherit;
  }

  .rest-display {
    font-variant-numeric: tabular-nums;
    font-size: 13px;
    letter-spacing: 0.03em;
  }
  .rest-display.live {
    color: var(--resting);
    font-weight: 600;
    font-size: 14px;
  }
  .rest-display.rest-reference {
    color: var(--muted);
    opacity: 0.55;
  }

  /* Action buttons col 5 */
  .action-cell-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .btn-action {
    width: 62px;
    height: 44px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.01em;
    padding: 0 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    touch-action: manipulation;
  }
  .btn-action:disabled {
    opacity: 0.3;
    cursor: default;
  }
  .btn-action.start-rest {
    background: var(--primary);
    color: #fff;
  }
  .btn-action.stop-rest {
    background: var(--resting);
    color: #fff;
    animation: pulse-resting 1.5s ease-in-out infinite;
  }
  .btn-action.complete-set {
    background: #dcfce7;
    color: #15803d;
    border: 1px solid #86efac;
  }
  .btn-action.done-indicator {
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    font-size: 16px;
  }

  .btn-del-set {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    touch-action: manipulation;
  }
  .btn-del-set:hover,
  .btn-del-set:active {
    background: rgba(220, 38, 38, 0.12);
    color: var(--danger);
  }

  @keyframes pulse-resting {
    0%, 100% { box-shadow: 0 0 0 0 rgba(234, 88, 12, 0.35); }
    50% { box-shadow: 0 0 0 6px rgba(234, 88, 12, 0); }
  }

  /* Bottom buttons */
  #workout-footer {
    margin: 20px 12px 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn-add-exercise {
    width: 100%;
    padding: 14px;
    background: var(--bg2);
    border: 1px dashed var(--border);
    border-radius: 12px;
    color: var(--muted);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }
  .btn-add-set {
    display: block;
    width: calc(100% - 28px);
    margin: 10px 14px 14px;
    padding: 10px;
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }
  .btn-add-set:active { background: var(--bg3); }

  /* Exercise note: grows with its text. The hidden ::after copy of the text
     sizes the grid cell, and the textarea fills that cell. */
  .exercise-note-wrap {
    display: grid;
    margin: 0 14px 14px;
  }
  .exercise-note-wrap::after {
    content: attr(data-value) ' ';
    white-space: pre-wrap;
    word-break: break-word;
    visibility: hidden;
  }
  .exercise-note,
  .exercise-note-wrap::after {
    grid-area: 1 / 1 / 2 / 2;
    min-height: 40px;
    padding: 9px 12px;
    font-size: 14px;
    line-height: 1.5;
    font-family: inherit;
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .exercise-note {
    resize: none;
    overflow: hidden;
    width: 100%;
    background: var(--bg);
    color: var(--text);
    outline: none;
  }
  .exercise-note:focus { border-color: var(--primary); }
  .exercise-note::placeholder { color: var(--muted); opacity: 0.6; }
  .btn-end-workout {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 2px solid var(--danger);
    border-radius: 12px;
    color: var(--danger);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }

  /* Modal */
  #modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  #modal-overlay.open { display: flex; }
  #modal-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 24px 20px 40px;
    width: 100%;
    max-width: 480px;
    animation: slide-up 0.25s ease-out;
  }
  @keyframes slide-up {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 20px;
    text-align: center;
  }
  .modal-field { margin-bottom: 14px; }
  .modal-label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  .modal-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .modal-input:focus { border-color: var(--primary); }
  .modal-btns {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .modal-cancel {
    flex: 1;
    padding: 13px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }
  .modal-confirm {
    flex: 1;
    padding: 13px;
    background: var(--primary);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }

  /* Exercise menu */
  .exercise-menu-btn {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 20px;
    padding: 4px 10px;
    border-radius: 8px;
    cursor: pointer;
    touch-action: manipulation;
    line-height: 1;
  }
  .exercise-menu-btn:active { background: var(--bg3); }

  #exercise-menu-overlay,
  #end-confirm-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  #exercise-menu-overlay.open,
  #end-confirm-overlay.open { display: flex; }
  #exercise-menu-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 16px 16px 40px;
    width: 100%;
    max-width: 480px;
    animation: slide-up 0.25s ease-out;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .menu-item {
    width: 100%;
    padding: 15px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
    text-align: left;
  }
  .menu-item-danger { color: var(--danger); }
  .menu-cancel {
    width: 100%;
    padding: 15px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
    margin-top: 4px;
  }

  /* End workout confirm */
  .confirm-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 24px 20px 40px;
    width: 100%;
    max-width: 480px;
    animation: slide-up 0.25s ease-out;
  }
  .confirm-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 8px;
    text-align: center;
  }
  .confirm-msg {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 20px;
  }
  .confirm-btns {
    display: flex;
    gap: 10px;
  }
  .confirm-cancel {
    flex: 1;
    padding: 13px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }
  .confirm-ok {
    flex: 1;
    padding: 13px;
    background: var(--danger);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }

  /* Sync status */
  #sync-bar {
    position: fixed;
    left: 50%;
    bottom: max(10px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 60;
    width: max-content;
    max-width: calc(100vw - 24px);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 12px;
    background: rgba(255, 248, 240, 0.92);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }
  #sync-bar.hidden, #sync-status:empty { display: none; }
  #btn-login {
    flex-shrink: 0;
    padding: 6px 12px;
    background: var(--primary);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
  }

  /* Login sheet */
  #auth-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }
  #auth-overlay.open { display: flex; }
  .auth-hint {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    margin: -8px 0 16px;
  }
  .auth-hint:empty, .auth-error:empty { display: none; }
  .auth-error {
    font-size: 14px;
    color: var(--danger);
    text-align: center;
    margin-top: 4px;
  }
  .auth-links {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 16px;
  }
  .auth-links button {
    background: none;
    border: none;
    color: var(--primary);
    font-size: 14px;
    cursor: pointer;
    font-family: inherit;
    touch-action: manipulation;
    padding: 6px;
  }
  .modal-confirm:disabled { opacity: 0.5; }
</style>
</head>
<body>

<!-- ═══════════════════════════ HOME PAGE ═══════════════════════════ -->
<div id="page-home">
  <div class="home-backdrop"></div>
  <div class="home-title">SHOW UP</div>
  <div class="home-main">
    <div class="home-img-wrap">
      <img id="home-img" src="jiduola.png" alt="Ghidorah">
      <!-- Left head → Shoulders -->
      <button class="head-btn"
        style="left:2%; top:18%; width:33%; height:80%;"
        onclick="navigate('shoulders')" data-i18n-aria="ariaShoulders" aria-label="肩训练"></button>
      <!-- Center head → Chest -->
      <button class="head-btn"
        style="left:33%; top:0%; width:34%; height:98%;"
        onclick="navigate('chest')" data-i18n-aria="ariaChest" aria-label="胸训练"></button>
      <!-- Right head → Back -->
      <button class="head-btn"
        style="left:65%; top:18%; width:33%; height:80%;"
        onclick="navigate('back')" data-i18n-aria="ariaBack" aria-label="背训练"></button>
    </div>
    <button id="btn-lang" class="lang-toggle" onclick="toggleLang()" data-i18n="langToggle">English</button>
  </div>
  <div class="home-spacer"></div>
</div>

<!-- ═══════════════════════════ WORKOUT PAGE ═══════════════════════════ -->
<div id="page-workout">
  <div id="workout-header">
    <button id="btn-back" onclick="goHome()">←</button>
    <div id="workout-title">训练</div>
    <div id="global-timer">00:00:00</div>
  </div>

  <div id="exercises-container"></div>

  <div id="workout-footer">
    <button class="btn-add-exercise" onclick="openAddModal()" data-i18n="addExercise">＋ 添加动作</button>
    <button class="btn-end-workout" onclick="endWorkout()" data-i18n="endWorkout">结束训练</button>
  </div>
</div>

<!-- ═══════════════════════════ EXERCISE MENU ═══════════════════════════ -->
<div id="exercise-menu-overlay">
  <div id="exercise-menu-box">
    <button class="menu-item" onclick="renameExercisePrompt()" data-i18n="renameExercise">重命名动作</button>
    <button class="menu-item menu-item-danger" onclick="deleteExerciseConfirm()" data-i18n="deleteExercise">删除动作</button>
    <button class="menu-cancel" onclick="closeExerciseMenu()" data-i18n="cancel">取消</button>
  </div>
</div>

<!-- ═══════════════════════════ END WORKOUT CONFIRM ═══════════════════════════ -->
<div id="end-confirm-overlay">
  <div class="confirm-box">
    <div class="confirm-title" data-i18n="endConfirmTitle">结束本次训练？</div>
    <div class="confirm-msg" data-i18n="endConfirmMsg">当前数据将保存为下次训练的模板。</div>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="cancelEndWorkout()" data-i18n="cancel">取消</button>
      <button class="confirm-ok" onclick="confirmEndWorkout()" data-i18n="endConfirmOk">确定结束</button>
    </div>
  </div>
</div>

// ═══════════════════════════════════════════════════

// ═══════════════════════════════════════════════════
const STORAGE_KEY = 'showup:state';

function defaultState() {
  return {
    routines: {
      chest:     { displayName: '胸', lastTrainedAt: null, exercises: [] },
      shoulders: { displayName: '肩', lastTrainedAt: null, exercises: [] },
      back:      { displayName: '背', lastTrainedAt: null, exercises: [] }
    },
    activeSession: null
  };
}

let state = defaultState();

// Every change the user makes goes through here, so it also marks the data as not yet in the cloud.
function save() {
  writeState();
  markChanged();
}

function writeState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

// Fills in routines missing from older saved data.
function withDefaults(parsed) {
  const s = { ...defaultState(), ...parsed };
  s.routines = { ...defaultState().routines, ...parsed.routines };
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = withDefaults(JSON.parse(raw));
  } catch(e) {}
  loadSync();
}

function isEmpty(s) {
  return !s.activeSession && Object.values(s.routines).every(r => !r.exercises.length);
}

// Until the 中文 / English button is tapped, follow the phone: Chinese phones get Chinese, every other phone English.
let lang = /^zh/i.test(navigator.language || '') ? 'zh' : 'en';
try {
  const saved = localStorage.getItem(LANG_KEY);
  if (saved === 'zh' || saved === 'en') lang = saved;
} catch(e) {}

function t(key, ...args) {
  const s = STRINGS[lang][key];
  return typeof s === 'function' ? s(...args) : s;
}

function routineName(routineKey) { return STRINGS[lang].routines[routineKey]; }

// Text written in the HTML; text built in JS reads t() when it's drawn.
function applyLang() {
  document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });

  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
}

function toggleLang() {

  try { localStorage.setItem(LANG_KEY, lang); } catch(e) {}
  applyLang();
  showSyncStatus();
}

// Before first paint, so English never flashes Chinese.
applyLang();

// ═══════════════════════════════════════════════════
//  ROUTING
// ═══════════════════════════════════════════════════
function navigate(routineKey) { window.location.hash = routineKey; }
function goHome() { window.location.hash = ''; }
function currentHash() { return window.location.hash.replace('#', ''); }

function render() {
  const hash = currentHash();
  const routineKeys = ['chest', 'shoulders', 'back'];
  const home = document.getElementById('page-home');
  const workout = document.getElementById('page-workout');

  endStaleSession();
  if (routineKeys.includes(hash)) {
    if (!enterRoutine(hash)) { goHome(); return; }
    home.style.display = 'none';
    workout.style.display = 'block';
    renderWorkout();
  } else {
    home.style.display = 'flex';
    workout.style.display = 'none';
    stopTimers();
  }
}

window.addEventListener('hashchange', render);
window.addEventListener('load', () => { load(); render(); startSync(); });

// ═══════════════════════════════════════════════════
//  SESSION MANAGEMENT
// ═══════════════════════════════════════════════════
const SESSION_MAX_MS = 4 * 60 * 60 * 1000;

// No real workout lasts this long: it was finished but never ended.
function isStale(ses) {
  return Date.now() - ses.startedAt > SESSION_MAX_MS;
}

function endStaleSession() {
  if (state.activeSession && isStale(state.activeSession)) finishSession();
}

// Last time's weight and reps, kept only while the workout runs to tell whether a set improved.
// Sets without last-time reps get none, so they're never hidden.
function withPrev(set) {
  if (set.reps > 0) set.prev = { weight: set.weight, reps: set.reps };
  return set;
}

// Reps stay behind frosted glass until the set is revealed, so last time's number isn't a ceiling.
function isMasked(set) {
  return !!set.prev && !set.revealed;
}

// Returns false if the user chose to keep the other routine's workout going.
function enterRoutine(routineKey) {
  const ses = state.activeSession;
  if (ses && ses.routineKey === routineKey) {
    startTimers();
    return true;
  }
  if (ses) {
    if (!confirm(t('switchRoutine', routineName(ses.routineKey), routineName(routineKey)))) return false;
    finishSession();
  }

  const routine = state.routines[routineKey];
  const templateExercises = JSON.parse(JSON.stringify(routine.exercises));
  const sessionExercises = templateExercises.map(ex => ({
    name: ex.name,
    note: ex.note || '',
    sets: ex.sets.map(s => withPrev({
      weight: s.weight || 0,
      reps: s.reps || 0,
      restSeconds: s.restSeconds ?? null
    }))
  }));

  state.activeSession = {
    routineKey,
    startedAt: Date.now(),
    exercises: sessionExercises,
    currentSetCursors: {},
    restingState: null
  };

  sessionExercises.forEach((_, i) => {
    state.activeSession.currentSetCursors[i] = 0;
  });

  save();
  startTimers();
  return true;
}

// ═══════════════════════════════════════════════════
//  TIMERS
// ═══════════════════════════════════════════════════
let timerInterval = null;

function startTimers() {
  stopTimers();
  timerInterval = setInterval(updateTimers, 1000);
  updateTimers();
}

function stopTimers() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function formatHMS(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return [h,m,s].map(v => String(v).padStart(2,'0')).join(':');
}

function formatMS(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return m + ':' + String(s).padStart(2,'0');
}

function updateTimers() {
  const ses = state.activeSession;
  if (!ses) return;
  // App was left open (e.g. suspended in the background): save it and start fresh.
  if (isStale(ses)) { render(); return; }

  const elapsed = Math.floor((Date.now() - ses.startedAt) / 1000);
  const timerEl = document.getElementById('global-timer');
  if (timerEl) timerEl.textContent = formatHMS(elapsed);

  if (ses.restingState) {
    const { exerciseIndex, setIndex, restStartedAt } = ses.restingState;
    const restElapsed = Math.floor((Date.now() - restStartedAt) / 1000);
    const cell = document.getElementById(`rest-cell-${exerciseIndex}-${setIndex}`);
    if (cell) {
      cell.textContent = formatMS(restElapsed);
      cell.className = 'rest-display live';
    }
  }
}

// ═══════════════════════════════════════════════════
//  CELL EDIT
// ═══════════════════════════════════════════════════
function startCellEdit(spanEl, exIdx, setIdx, field) {
  const ses = state.activeSession;
  if (!ses) return;
  if (field === 'rest' && ses.restingState &&
      ses.restingState.exerciseIndex === exIdx &&
      ses.restingState.setIndex === setIdx) return;

  const set = ses.exercises[exIdx].sets[setIdx];
  if (field === 'reps' && isMasked(set)) {
    // Only the current or a finished set opens, so a stray tap can't peek ahead.
    if (setIdx > (ses.currentSetCursors[exIdx] ?? 0)) return;
    // Opening the glass sticks, so it's saved before `original`: Escape must not mask it again.
    set.revealed = true;
    spanEl.classList.remove('cell-masked');
    spanEl.textContent = set.reps || 0;
    // Weight raised beforehand and last time's reps done: that's already progress.
    revealIfImproved(ses.exercises[exIdx], exIdx);
    save();
  }
  const original = { ...set };
  const inp = document.createElement('input');
  inp.type = 'number';
  inp.inputMode = 'decimal';
  inp.className = 'cell-edit-input';
  if (field === 'rest') {
    inp.style.width = '56px';
    inp.value = set.restSeconds ?? 0;
  } else {
    // From the set, not the cell: a masked cell only shows placeholder digits.
    inp.value = set[field] || 0;
  }
  // Save every keystroke: on iOS tapping a button doesn't blur the input,
  // so the next re-render (or ending the workout) can drop it without a blur.
  inp.oninput = () => setCellValue(set, field, inp.value);
  inp.onblur = () => commitCellEdit(inp, spanEl, set, field);
  inp.onkeydown = (e) => {
    if (e.key === 'Enter')  { e.preventDefault(); commitCellEdit(inp, spanEl, set, field); }
    if (e.key === 'Escape') { e.preventDefault(); cancelCellEdit(inp, spanEl, set, original); }
  };
  spanEl.replaceWith(inp);
  inp.focus();
  inp.select();
}

function setCellValue(set, field, value) {
  const numVal = parseFloat(value) || 0;
  if (field === 'weight') set.weight = numVal;
  else if (field === 'reps') set.reps = Math.round(numVal);
  else if (field === 'rest') set.restSeconds = Math.round(numVal);
  const ses = state.activeSession;
  // By reference, not index: deleting a set shifts the indexes.
  // No session when the input blurs late, after the workout already ended.
  const exIdx = ses ? ses.exercises.findIndex(e => e.sets.includes(set)) : -1;
  if (exIdx >= 0) revealIfImproved(ses.exercises[exIdx], exIdx);
  save();
}

function isImproved(set) {
  const { prev } = set;
  return !!prev && ((set.weight === prev.weight && set.reps > prev.reps) ||
                    (set.weight > prev.weight && set.reps >= prev.reps));
}

// One opened set that beat last time is enough for the day: open the glass on the rest of the exercise.
// Cells are updated in place because re-rendering would drop the input being typed in, and the keyboard with it.
// Caller saves.
function revealIfImproved(ex, exIdx) {
  if (!ex.sets.some(s => s.revealed && isImproved(s))) return;
  ex.sets.forEach(s => { if (s.prev) s.revealed = true; });
  const card = document.getElementById(`exercise-card-${exIdx}`);
  if (!card) return;
  card.querySelectorAll('.cell-masked').forEach(span => {
    span.textContent = ex.sets[span.dataset.setIdx].reps || 0;
    span.classList.remove('cell-masked');
  });
}

function commitCellEdit(inp, spanEl, set, field) {
  if (inp._done) return;
  inp._done = true;
  setCellValue(set, field, inp.value);
  const numVal = parseFloat(inp.value) || 0;
  spanEl.textContent = field === 'rest' ? formatMS(Math.round(numVal)) : (numVal || 0);
  inp.replaceWith(spanEl);
}

function cancelCellEdit(inp, spanEl, set, original) {
  if (inp._done) return;
  inp._done = true;
  Object.assign(set, original);
  save();
  inp.replaceWith(spanEl);
}

// ═══════════════════════════════════════════════════
//  RENDER WORKOUT
// ═══════════════════════════════════════════════════
function renderWorkout() {
  const ses = state.activeSession;
  if (!ses) return;

  document.getElementById('workout-title').textContent = t('workoutTitle', routineName(ses.routineKey));

  const container = document.getElementById('exercises-container');
  container.innerHTML = '';

  ses.exercises.forEach((ex, exIdx) => {
    const cursor = ses.currentSetCursors[exIdx] ?? 0;
    container.appendChild(buildExerciseCard(ex, exIdx, cursor, ses));
  });

  updateTimers();
}

function buildExerciseCard(ex, exIdx, cursor, ses) {
  const card = document.createElement('div');
  card.className = 'exercise-card';
  card.id = `exercise-card-${exIdx}`;

  // Header
  const header = document.createElement('div');
  header.className = 'exercise-header';

  const nameSpan = document.createElement('div');
  nameSpan.className = 'exercise-name';
  nameSpan.textContent = ex.name;

  const right = document.createElement('div');
  right.style.cssText = 'display:flex;align-items:center;gap:8px;flex-shrink:0;';

  const menuBtn = document.createElement('button');
  menuBtn.className = 'exercise-menu-btn';
  menuBtn.textContent = '⋯';
  menuBtn.onclick = (e) => { e.stopPropagation(); openExerciseMenu(exIdx); };

  const setsCount = document.createElement('div');
  setsCount.className = 'exercise-sets-count';
  setsCount.textContent = t('setsCount', ex.sets.length);

  right.appendChild(menuBtn);
  right.appendChild(setsCount);
  header.appendChild(nameSpan);
  header.appendChild(right);
  card.appendChild(header);

  // Table
  const table = document.createElement('table');
  table.className = 'sets-table';
  table.innerHTML = `<thead><tr>
    <th>#</th>
    <th>${t('colWeight')}<br><span style="font-size:10px;opacity:0.6">LBS</span></th>
    <th>${t('colReps')}</th>
    <th>${t('colRest')}</th>
    <th>${t('colAction')}</th>
  </tr></thead>`;

  const tbody = document.createElement('tbody');
  const isLastSet = i => i === ex.sets.length - 1;
  const isResting = ses.restingState &&
    ses.restingState.exerciseIndex === exIdx &&
    ses.restingState.setIndex === cursor;

  ex.sets.forEach((set, setIdx) => {
    const tr = document.createElement('tr');
    let rowClass = 'set-row';
    if (setIdx < cursor) rowClass += ' completed';
    else if (setIdx === cursor) rowClass += isResting ? ' resting' : ' current';
    else rowClass += ' pending';
    tr.className = rowClass;

    // # col
    const tdNum = document.createElement('td');
    tdNum.className = 'cell-num';
    tdNum.textContent = setIdx + 1;
    tr.appendChild(tdNum);

    // Weight col
    tr.appendChild(buildNumCell(set, exIdx, setIdx, 'weight'));
    // Reps col
    tr.appendChild(buildNumCell(set, exIdx, setIdx, 'reps'));

    // Rest col
    tr.appendChild(buildRestCell(set, exIdx, setIdx, cursor, isLastSet(setIdx), isResting, ses));

    // Action col
    tr.appendChild(buildActionCell(setIdx, cursor, exIdx, isLastSet(setIdx), isResting));

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  card.appendChild(table);

  const addSetBtn = document.createElement('button');
  addSetBtn.className = 'btn-add-set';
  addSetBtn.textContent = t('addSet');
  addSetBtn.onclick = () => addSet(exIdx);
  card.appendChild(addSetBtn);

  card.appendChild(buildNote(ex));

  return card;
}

function buildNote(ex) {
  const wrap = document.createElement('div');
  wrap.className = 'exercise-note-wrap';
  wrap.dataset.value = ex.note || '';

  const note = document.createElement('textarea');
  note.className = 'exercise-note';
  note.rows = 1;
  note.placeholder = t('notePlaceholder');
  note.value = ex.note || '';
  // Saved on every keystroke, like the number cells: iOS may not blur before the next tap.
  note.oninput = () => {
    ex.note = note.value;
    wrap.dataset.value = note.value;
    save();
  };
  wrap.appendChild(note);
  return wrap;
}

function buildNumCell(set, exIdx, setIdx, field) {
  const td = document.createElement('td');
  const span = document.createElement('span');
  span.className = 'cell-readonly';
  if (field === 'reps' && isMasked(set)) {
    // Placeholder digits under the glass: the real number isn't on the page at all.
    span.className += ' cell-masked';
    span.textContent = '88';
    span.dataset.setIdx = setIdx;
  } else {
    span.textContent = set[field] || 0;
  }
  span.onclick = (e) => startCellEdit(e.currentTarget, exIdx, setIdx, field);
  td.appendChild(span);
  return td;
}

function buildRestCell(set, exIdx, setIdx, cursor, isLast, isResting, ses) {
  const td = document.createElement('td');

  if (isLast) {
    // Last set: never shows rest
    const span = document.createElement('span');
    span.className = 'rest-display';
    span.style.color = 'var(--muted)';
    span.textContent = '—';
    td.appendChild(span);
    return td;
  }

  if (setIdx === cursor && isResting) {
    // Live timer — not editable
    const span = document.createElement('span');
    span.id = `rest-cell-${exIdx}-${setIdx}`;
    const restElapsed = Math.floor((Date.now() - ses.restingState.restStartedAt) / 1000);
    span.textContent = formatMS(restElapsed);
    span.className = 'rest-display live';
    td.appendChild(span);
    return td;
  }

  if (set.restSeconds !== null && set.restSeconds !== undefined && setIdx < cursor) {
    const span = document.createElement('span');
    span.id = `rest-cell-${exIdx}-${setIdx}`;
    span.className = 'cell-readonly rest-display';
    span.textContent = formatMS(set.restSeconds);
    span.onclick = (e) => startCellEdit(e.currentTarget, exIdx, setIdx, 'rest');
    td.appendChild(span);
    return td;
  }

  if (set.restSeconds !== null && set.restSeconds !== undefined && setIdx >= cursor) {
    // Not yet redone this session: show last recorded value as a reference
    const span = document.createElement('span');
    span.id = `rest-cell-${exIdx}-${setIdx}`;
    span.className = 'rest-display rest-reference';
    span.textContent = formatMS(set.restSeconds);
    td.appendChild(span);
    return td;
  }

  // Empty / pending
  const span = document.createElement('span');
  span.id = `rest-cell-${exIdx}-${setIdx}`;
  span.className = 'rest-display';
  span.textContent = '';
  td.appendChild(span);
  return td;
}

function buildActionCell(setIdx, cursor, exIdx, isLast, isResting) {
  const td = document.createElement('td');
  const wrap = document.createElement('div');
  wrap.className = 'action-cell-wrap';

  const btn = document.createElement('button');
  btn.className = 'btn-action';

  if (setIdx < cursor) {
    btn.textContent = '✓';
    btn.className += ' done-indicator';
    btn.disabled = true;
  } else if (setIdx === cursor) {
    if (isLast) {
      btn.textContent = t('done');
      btn.className += ' complete-set';
      btn.onclick = () => completeLastSet(exIdx);
    } else if (isResting) {
      btn.textContent = t('stopRest');
      btn.className += ' stop-rest';
      btn.onclick = () => stopRest(exIdx);
    } else {
      btn.textContent = t('startRest');
      btn.className += ' start-rest';
      btn.onclick = () => startRest(exIdx);
    }
  } else {
    btn.textContent = '—';
    btn.disabled = true;
    btn.className += ' done-indicator';
  }

  const delBtn = document.createElement('button');
  delBtn.className = 'btn-del-set';
  delBtn.textContent = '✕';
  delBtn.onclick = () => deleteSet(exIdx, setIdx);

  wrap.appendChild(btn);
  wrap.appendChild(delBtn);
  td.appendChild(wrap);
  return td;
}

// ═══════════════════════════════════════════════════
//  REST TIMER ACTIONS
// ═══════════════════════════════════════════════════
function startRest(exIdx) {
  const ses = state.activeSession;
  const cursor = ses.currentSetCursors[exIdx] ?? 0;
  ses.restingState = { exerciseIndex: exIdx, setIndex: cursor, restStartedAt: Date.now() };
  save();
  renderWorkout();
}

function stopRest(exIdx) {
  const ses = state.activeSession;
  if (!ses.restingState) return;
  const { restStartedAt, setIndex } = ses.restingState;
  const restSeconds = Math.round((Date.now() - restStartedAt) / 1000);
  ses.exercises[exIdx].sets[setIndex].restSeconds = restSeconds;
  ses.currentSetCursors[exIdx] = (ses.currentSetCursors[exIdx] ?? 0) + 1;
  ses.restingState = null;
  save();
  renderWorkout();
}

function completeLastSet(exIdx) {
  const ses = state.activeSession;
  const ex = ses.exercises[exIdx];
  const lastIdx = ex.sets.length - 1;
  ex.sets[lastIdx].restSeconds = null;
  ses.currentSetCursors[exIdx] = lastIdx + 1;
  ses.restingState = null;
  save();
  renderWorkout();
}

// ═══════════════════════════════════════════════════
//  SET ADD / DELETE
// ═══════════════════════════════════════════════════
function addSet(exIdx) {
  const ses = state.activeSession;
  const ex = ses.exercises[exIdx];
  const last = ex.sets[ex.sets.length - 1];
  ex.sets.push({
    weight: last ? last.weight || 0 : 0,
    reps: last ? last.reps || 0 : 0,
    restSeconds: null
  });
  save();
  renderWorkout();
}

function deleteSet(exIdx, setIdx) {
  const ses = state.activeSession;
  const ex = ses.exercises[exIdx];

  if (ex.sets.length <= 1) {
    alert(t('keepOneSet'));
    return;
  }
  if (!confirm(t('deleteSetConfirm', setIdx + 1))) return;

  ex.sets.splice(setIdx, 1);

  const cursor = ses.currentSetCursors[exIdx] ?? 0;
  let newCursor = cursor;
  if (setIdx < cursor) newCursor = cursor - 1;
  ses.currentSetCursors[exIdx] = Math.max(0, Math.min(newCursor, ex.sets.length));

  if (ses.restingState && ses.restingState.exerciseIndex === exIdx) {
    if (ses.restingState.setIndex === setIdx) {
      ses.restingState = null;
    } else if (ses.restingState.setIndex > setIdx) {
      ses.restingState.setIndex -= 1;
    }
  }

  save();
  renderWorkout();
}

function openAddModal() {
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-sets').value = '';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-name').focus(), 100);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function confirmAddExercise() {
  const name = document.getElementById('modal-name').value.trim();
  const setsCount = parseInt(document.getElementById('modal-sets').value) || 0;
  if (!name || setsCount < 1) return;

  const ses = state.activeSession;
  if (!ses) return;

  const templateEx = state.routines[ses.routineKey].exercises.find(e => e.name === name);
  const sets = Array.from({ length: setsCount }, (_, i) => {
    if (templateEx && templateEx.sets[i]) {
      return withPrev({ weight: templateEx.sets[i].weight || 0, reps: templateEx.sets[i].reps || 0, restSeconds: null });
    }
    return { weight: 0, reps: 0, restSeconds: null };
  });

  const newExIdx = ses.exercises.length;
  ses.exercises.push({ name, note: templateEx ? templateEx.note || '' : '', sets });
  ses.currentSetCursors[newExIdx] = 0;

  save();
  closeModal();
  renderWorkout();

  setTimeout(() => {
    const card = document.getElementById(`exercise-card-${newExIdx}`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

document.getElementById('modal-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('modal-sets').focus();
});
document.getElementById('modal-sets').addEventListener('keydown', e => {

});

function endWorkout() {
  document.getElementById('end-confirm-overlay').classList.add('open');
}

function cancelEndWorkout() {
  document.getElementById('end-confirm-overlay').classList.remove('open');
}

// Copy the active session into its routine as next time's template, then clear it.
// The workout also joins the upload queue for the cloud history.
function finishSession() {
  const ses = state.activeSession;
  if (ses) {
    const routineKey = ses.routineKey;
    // The glass is only for this workout: last time's numbers stay out of the template and the history.
    const exercises = ses.exercises.map(ex => ({ ...ex, sets: ex.sets.map(({ prev, revealed, ...s }) => s) }));
    state.routines[routineKey].exercises = JSON.parse(JSON.stringify(exercises));
    state.routines[routineKey].lastTrainedAt = Date.now();
    queueWorkout({
      clientId: newId(),
      routineKey,
      startedAt: ses.startedAt,
      endedAt: Date.now(),
      exercises: JSON.parse(JSON.stringify(exercises))
    });
  }
  state.activeSession = null;
  save();
}

function confirmEndWorkout() {
  finishSession();
  announceSaved = true;
  stopTimers();
  const t = document.getElementById('global-timer');
  if (t) t.textContent = '00:00:00';
  document.getElementById('end-confirm-overlay').classList.remove('open');
  window.location.hash = '';
}

//  CLOUD
// ═══════════════════════════════════════════════════
const SUPABASE_URL = 'https://hirgxetardfgzaskcczo.supabase.co';
// Publishable key: meant to be in the page. Row level security keeps each user to their own rows.
const SUPABASE_KEY = 'sb_publishable_zxIQKeBuQgSObxCvRdyQQw_o9CCACkT';

// The only code that talks to the network. Tests put a fake cloud in window.showUpCloud.
// Failures are thrown as errors with a `code`; 'offline' means the request never reached Supabase.
const cloud = window.showUpCloud || supabaseCloud();

function supabaseCloud() {
  let client = null;
  const iso = ms => ms == null ? null : new Date(ms).toISOString();
  const toUser = u => ({ id: u.id, email: u.email });

  function cloudError(e) {
    const err = new Error(e.message || String(e));
    // Chrome says "Failed to fetch", Safari "Load failed"; the SDK script missing means no network at load.
    const offline = e.name === 'AuthRetryableFetchError' || /fetch|load failed|network|not loaded/i.test(err.message);
    err.code = offline ? 'offline' : (e.code || e.name);
    return err;
  }

  // Supabase returns { data, error } instead of throwing.
  async function run(fn) {
    let res;
    try {
      if (!client) {
        if (!window.supabase) throw new Error('supabase-js not loaded');
        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { detectSessionInUrl: false } });
      }
      res = await fn(client);
    } catch (e) { throw cloudError(e); }
    if (res.error) throw cloudError(res.error);
    return res.data;
  }

  return {
    async currentUser() {
      const { session } = await run(c => c.auth.getSession());
      return session ? toUser(session.user) : null;
    },
    async signUp(email, password) {
      const { user } = await run(c => c.auth.signUp({ email, password }));
      // An already confirmed email gets a stand-in user with no identities and no email is sent.
      if (user && user.identities && !user.identities.length) {
        throw Object.assign(new Error('user already exists'), { code: 'user_already_exists' });
      }
    },
    resendSignupCode: email => run(c => c.auth.resend({ type: 'signup', email })),
    verifySignupCode: async (email, token) =>
      toUser((await run(c => c.auth.verifyOtp({ email, token, type: 'email' }))).user),
    signIn: async (email, password) =>
      toUser((await run(c => c.auth.signInWithPassword({ email, password }))).user),
    sendResetCode: email => run(c => c.auth.resetPasswordForEmail(email)),
    verifyResetCode: async (email, token) =>
      toUser((await run(c => c.auth.verifyOtp({ email, token, type: 'recovery' }))).user),
    setPassword: password => run(c => c.auth.updateUser({ password })),

    async pullState() {
      const row = await run(c => c.from('user_state').select('state, updated_at').maybeSingle());
      return row && { state: row.state, updatedAt: Date.parse(row.updated_at) };
    },
    pushState: (state, updatedAt) =>
      run(c => c.from('user_state').upsert({ state, updated_at: iso(updatedAt) })),
    async appendWorkout(w) {
      try {
        await run(c => c.from('workouts').insert({
          client_id: w.clientId, routine_key: w.routineKey,
          started_at: iso(w.startedAt), ended_at: iso(w.endedAt), exercises: w.exercises
        }));
      } catch (e) {
        if (e.code !== '23505') throw e; // already there from an earlier try
      }
    },
    backupState: (state, updatedAt) =>
      run(c => c.from('state_backups').insert({ state, updated_at: iso(updatedAt) })),
  };
}

// ═══════════════════════════════════════════════════
//  SYNC
// ═══════════════════════════════════════════════════
// showup:state stays the one copy the app works on. Next to it:
//   showup:sync     { userId, dirty, localUpdatedAt, cloudSeenAt }
//     dirty: changed since the last upload. cloudSeenAt: the cloud copy's updatedAt we last uploaded
//     or downloaded, so a different value means another phone changed it.
//   showup:pending  finished workouts not yet in the cloud history, oldest first.
const SYNC_KEY = 'showup:sync';
const PENDING_KEY = 'showup:pending';
const SYNC_INTERVAL_MS = 30 * 1000;

let syncMeta = null;
let pending = [];
let signedIn = false;
let edits = 0;          // bumps on every change, to spot edits made while a sync was in flight
let syncing = null;
let syncAgain = false;
let syncError = null;   // code of the last failed sync, null after a good one
let announceSaved = false; // a workout was just ended: say so once the cloud has it

function loadSync() {
  try { syncMeta = JSON.parse(localStorage.getItem(SYNC_KEY)); } catch(e) {}
  if (!syncMeta) {
    // First launch of this version: whatever is on the phone has never been uploaded.
    syncMeta = { userId: null, dirty: !isEmpty(state), localUpdatedAt: lastActivity(state), cloudSeenAt: null };
    writeSync();
  }
  try { pending = JSON.parse(localStorage.getItem(PENDING_KEY)) || []; } catch(e) {}
  signedIn = !!syncMeta.userId;
}

function writeSync() {
  try { localStorage.setItem(SYNC_KEY, JSON.stringify(syncMeta)); } catch(e) {}
}

function writePending() {
  try { localStorage.setItem(PENDING_KEY, JSON.stringify(pending)); } catch(e) {}
}

function queueWorkout(workout) {
  pending.push(workout);
  writePending();
}

function newId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

// Best guess at when data saved before sync existed was last changed.
function lastActivity(s) {
  const times = Object.values(s.routines).map(r => r.lastTrainedAt || 0);
  if (s.activeSession) times.push(s.activeSession.startedAt);
  return Math.max(0, ...times);
}

function markChanged() {
  edits++;
  announceSaved = false;
  syncMeta.dirty = true;
  syncMeta.localUpdatedAt = Date.now();
  writeSync();
  requestSync();
}

function startSync() {
  window.addEventListener('online', requestSync);
  window.addEventListener('pageshow', requestSync);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') requestSync();
  });
  setInterval(requestSync, SYNC_INTERVAL_MS);
  requestSync();
}

// Runs a sync now, or once more after the one in flight, so calls never overlap.
function requestSync() {
  if (syncing) { syncAgain = true; return syncing; }
  showSyncStatus();
  syncing = (async () => {
    do { syncAgain = false; await syncOnce(); } while (syncAgain);
  })().finally(() => { syncing = null; });
  return syncing;
}

async function syncOnce() {
  try {
    const user = await cloud.currentUser();
    signedIn = !!user;
    if (!user) return;
    if (user.id !== syncMeta.userId) {
      // Someone new on this phone: we know nothing about their cloud copy yet.
      syncMeta.userId = user.id;
      syncMeta.cloudSeenAt = null;
      writeSync();
    }

    await uploadPending();
    const remote = await cloud.pullState();

    const cloudChanged = remote && remote.updatedAt !== syncMeta.cloudSeenAt && !isEmpty(remote.state);
    if (cloudChanged && (!syncMeta.dirty || isEmpty(state))) {
      adoptCloud(remote);
    } else if (cloudChanged && remote.updatedAt > syncMeta.localUpdatedAt) {
      // Both changed and the cloud's is newer: take it, and keep ours as a backup in the cloud.
      const editsBefore = edits;
      await cloud.backupState(JSON.parse(JSON.stringify(state)), syncMeta.localUpdatedAt);
      if (edits !== editsBefore) { syncAgain = true; return; } // the backup missed the newest edit
      adoptCloud(remote);
    } else if (cloudChanged) {
      // Both changed and ours is newer: back up the cloud's before replacing it.
      await cloud.backupState(remote.state, remote.updatedAt);
      await pushLocal();
    } else if (syncMeta.dirty || !remote) {
      await pushLocal();
    }
    syncError = null;
  } catch (e) {
    syncError = e.code || 'failed';
  } finally {
    showSyncStatus();
  }
}

async function uploadPending() {
  while (pending.length) {
    await cloud.appendWorkout(pending[0]);
    pending.shift();
    writePending();
  }
}

async function pushLocal() {
  const editsBefore = edits;
  const at = syncMeta.localUpdatedAt;
  await cloud.pushState(JSON.parse(JSON.stringify(state)), at);
  syncMeta.cloudSeenAt = at;
  if (edits === editsBefore) syncMeta.dirty = false;
  writeSync();
}

function adoptCloud(remote) {
  state = withDefaults(remote.state);
  writeState();
  syncMeta.dirty = false;
  syncMeta.localUpdatedAt = syncMeta.cloudSeenAt = remote.updatedAt;
  writeSync();
  render();
}

function showSyncStatus() {
  const text = document.getElementById('sync-status');
  document.getElementById('btn-login').style.display = signedIn ? 'none' : '';
  if (!signedIn) text.textContent = t('syncSignedOut');
  else if (!syncMeta.dirty && !pending.length) text.textContent = t(announceSaved ? 'syncSavedToCloud' : 'syncSynced');
  else if (syncError === 'offline') text.textContent = t('syncOffline');
  else if (syncError) text.textContent = t('syncFailed');
  else text.textContent = t('syncUploading');
}

// Titles, buttons and link labels are in STRINGS[lang].authViews, in the same order as `links` here.
const AUTH_VIEWS = {
  signin: { fields: ['email', 'password'], links: ['signup', 'forgot'] },
  signup: { fields: ['email', 'password'], links: ['signin'] },
  verify: { fields: ['code'], links: ['resend'] },
  forgot: { fields: ['email'], links: ['signin'] },
  reset:  { fields: ['code', 'password'], links: ['forgot'] },
};

let authView = 'signin';
let resetVerified = false; // the reset code is single use; don't spend it again if only the password failed

function openAuth(view) {
  document.getElementById('auth-overlay').classList.add('open');
  showAuthView(view);
}

function closeAuth() {
  document.getElementById('auth-overlay').classList.remove('open');
}

function showAuthView(view, hint = '') {
  if (view === 'resend') { resendCode(); return; }
  authView = view;
  const v = AUTH_VIEWS[view];
  const words = STRINGS[lang].authViews[view];
  document.getElementById('auth-title').textContent = words.title;
  document.getElementById('auth-hint').textContent = hint;
  document.getElementById('auth-error').textContent = '';
  document.getElementById('auth-submit').textContent = words.submit;
  for (const f of ['email', 'code', 'password']) {
    document.getElementById(`auth-${f}-field`).style.display = v.fields.includes(f) ? '' : 'none';
  }
  const newPassword = view === 'signup' || view === 'reset';
  document.getElementById('auth-password-label').textContent = t(view === 'reset' ? 'passwordReset'
    : view === 'signup' ? 'passwordNew' : 'password');
  document.getElementById('auth-password').autocomplete = newPassword ? 'new-password' : 'current-password';
  document.getElementById('auth-code').value = '';
  if (view === 'reset') resetVerified = false;

  const links = document.getElementById('auth-links');
  links.innerHTML = '';
  v.links.forEach((target, i) => {
    const btn = document.createElement('button');
    btn.textContent = words.links[i];
    btn.dataset.authView = target;
    btn.onclick = () => showAuthView(target);
    links.appendChild(btn);
  });
}

function authErrorText(e) {
  return STRINGS[lang].authErrors[e.code] || t('authErrorOther', e.message);
}

async function submitAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const code = document.getElementById('auth-code').value.trim();
  const submit = document.getElementById('auth-submit');
  document.getElementById('auth-error').textContent = '';
  submit.disabled = true;
  try {
    if (authView === 'signin') {
      onSignedIn(await cloud.signIn(email, password));
    } else if (authView === 'signup') {
      await cloud.signUp(email, password);
      showAuthView('verify', t('codeSent', email));
    } else if (authView === 'verify') {
      onSignedIn(await cloud.verifySignupCode(email, code));
    } else if (authView === 'forgot') {
      await cloud.sendResetCode(email);
      showAuthView('reset', t('codeSent', email));
    } else if (authView === 'reset') {
      if (password.length < 6) throw Object.assign(new Error(), { code: 'weak_password' });
      if (!resetVerified) { await cloud.verifyResetCode(email, code); resetVerified = true; }
      await cloud.setPassword(password);
      onSignedIn(await cloud.currentUser());
    }
  } catch (e) {
    if (e.code === 'email_not_confirmed') {
      showAuthView('verify', t('emailNotConfirmed', email));
      resendCode();
    } else {
      document.getElementById('auth-error').textContent = authErrorText(e);
    }
  } finally {
    submit.disabled = false;
  }
}

async function resendCode() {
  const email = document.getElementById('auth-email').value.trim();
  try {
    await cloud.resendSignupCode(email);
    document.getElementById('auth-hint').textContent = t('codeResent', email);
  } catch (e) {
    document.getElementById('auth-error').textContent = authErrorText(e);
  }
}

function onSignedIn(user) {
  closeAuth();
  signedIn = true;
  if (user.id !== syncMeta.userId) {
    syncMeta.userId = user.id;
    syncMeta.cloudSeenAt = null;
    writeSync();
  }
  requestSync();
}

document.getElementById('auth-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('auth-overlay')) closeAuth();
});
</script>
</body>
</html>
