<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Show Up</title>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<style>
  * { box-sizing: border-box; }

  /* Colour only ever means a body part. Everything else is black, white and grey. */
  :root {
    --bg: #000;
    --card: #1c1c1e;
    --raised: #2c2c2e;
    --ink: #fff;
    --ink2: #a1a1a6;
    --line: rgba(255, 255, 255, 0.1);
    --danger: #ff9f94;
  }

  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .key {
    flex: none; display: inline-block;
    width: 11px; height: 11px; border-radius: 3.5px;
    background: var(--col);
  }

  /* ───── HOME ───── */
  #page-home { min-height: 100dvh; }
  .home-wrap {
    max-width: 430px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 0 120px;
  }
  .top { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
  h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; letter-spacing: -0.01em; }
  .lang-toggle {
    min-height: 32px; padding: 0 12px;
    background: var(--card); border: 0; border-radius: 999px;
    color: var(--ink2); font-size: 13px; font-weight: 600;
  }
  .sum { margin: 6px 16px 18px; font-size: 15px; color: var(--ink2); }

  .heat-scroll {
    overflow-x: auto; scrollbar-width: none;
    padding: 0 16px 6px;
    -webkit-overflow-scrolling: touch;
  }
  .heat-scroll::-webkit-scrollbar { display: none; }
  .heat { position: relative; }
  .month { position: absolute; top: 0; font-size: 11px; color: var(--ink2); white-space: nowrap; }
  .d {
    position: absolute; width: 18px; height: 18px;
    padding: 0; border: 0; border-radius: 5px;
    background: var(--card);
  }
  .d::before { content: ""; position: absolute; inset: -2px; } /* full 22px tap target */
  .d.future { background: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07); pointer-events: none; }
  .d.today { box-shadow: 0 0 0 1.5px var(--bg), 0 0 0 3px var(--ink); z-index: 1; }
  .pop { animation: tile 480ms cubic-bezier(.2, .9, .3, 1.25) both; animation-delay: var(--delay, 0ms); }
  .d.pop::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit;
    box-shadow: 0 0 0 2px var(--ink);
    animation: ripple 640ms ease-out both;
    pointer-events: none;
  }
  @keyframes tile { from { transform: scale(.25); } to { transform: scale(1); } }
  @keyframes ripple { from { transform: scale(1); opacity: .9; } to { transform: scale(2.6); opacity: 0; } }

  h2 { margin: 18px 16px 12px; font-size: 22px; line-height: 1.2; font-weight: 700; }
  .parts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 16px; }
  .part {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 6px 6px; align-content: space-between;
    min-height: 86px; padding: 14px 14px 15px; text-align: left;
    background: var(--card); border: 0; border-radius: 18px;
    transition: transform 140ms ease-out, background 140ms ease-out;
  }
  .part:active { transform: scale(.97); background: var(--raised); }
  .part-name { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 600; line-height: 1.2; min-width: 0; overflow-wrap: break-word; }
  .part-when { margin-left: auto; font-size: 13px; color: var(--ink2); white-space: nowrap; }
  .part-when.now { color: var(--ink); font-weight: 600; }
  .strip { flex: 0 0 100%; display: flex; justify-content: space-between; margin-top: 8px; }
  .m { display: block; width: 8px; height: 8px; border-radius: 2.5px; background: var(--raised); }
  .m.on { background: var(--col); }
  .m.today { box-shadow: 0 0 0 1px var(--card), 0 0 0 2px rgba(255, 255, 255, 0.5); }
  .add-part {
    display: flex; align-items: center; justify-content: center;
    min-height: 86px;
    background: none; border: 1px dashed rgba(255, 255, 255, 0.24); border-radius: 18px;
    font-size: 15px; font-weight: 600;
    transition: transform 140ms ease-out;
  }
  .add-part:active { transform: scale(.97); }
  .home-foot { margin: 20px 16px 0; text-align: center; }
  .link-btn { background: none; border: 0; padding: 8px; font-size: 13px; color: var(--ink2); text-decoration: underline; }

  /* ───── WORKOUT ───── */
  #page-workout {
    display: none;
    min-height: 100dvh;
    padding-bottom: 120px;
  }
  #workout-header {
    position: sticky; top: 0; z-index: 50;
    display: grid; grid-template-columns: 76px 1fr 76px; align-items: center;
    padding: max(6px, env(safe-area-inset-top)) 12px 6px 4px;
    background: rgba(0, 0, 0, 0.78);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  #btn-back { width: 44px; height: 44px; display: grid; place-items: center; background: none; border: 0; border-radius: 50%; }
  #btn-back svg { width: 12px; height: 20px; }
  .w-title { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 700; min-width: 0; }
  #global-timer { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 14px; font-weight: 600; }
  #exercises-container { max-width: 560px; margin: 0 auto; padding: 8px 16px 0; }

  .exercise-card { margin-bottom: 12px; padding: 16px; background: var(--card); border-radius: 18px; }
  .exercise-header {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center;
  }
  .exercise-name { font-size: 18px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
  .exercise-menu-btn {
    background: none; border: 0; color: var(--ink2);
    font-size: 20px; line-height: 1; padding: 4px 10px; margin-right: -10px; border-radius: 8px;
  }
  .exercise-menu-btn:active { background: var(--raised); }
  .ex-meta { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink2); }
  .ex-part { display: inline-flex; align-items: center; gap: 6px; }
  .ex-part .key { width: 9px; height: 9px; border-radius: 3px; }
  .ex-squares { display: flex; gap: 4px; justify-self: end; }
  .ex-squares .m { width: 14px; height: 14px; border-radius: 4px; }
  .exercise-sets-count { white-space: nowrap; }

  .sets-table { width: 100%; margin-top: 12px; border-collapse: collapse; font-size: 16px; font-variant-numeric: tabular-nums; }
  .sets-table th { padding: 4px 2px; font-size: 12px; font-weight: 500; color: var(--ink2); text-align: center; }
  .sets-table th:first-child { width: 28px; }
  .sets-table th:nth-child(2), .sets-table th:nth-child(3) { width: 60px; }
  .sets-table th:nth-child(4) { width: 58px; }
  .sets-table td { padding: 4px 2px; text-align: center; border-top: 1px solid var(--line); vertical-align: middle; font-weight: 600; }
  .set-row { transition: background 0.2s; }
  .set-row.completed td { color: var(--ink2); font-weight: 500; }
  .set-row.pending { opacity: 0.55; }
  .set-row.resting { background: rgba(255, 255, 255, 0.06); }
  .cell-num { color: var(--ink2); font-size: 13px; }

  .cell-readonly {
    display: inline-block; min-width: 36px; padding: 6px 8px;
    cursor: pointer; border-radius: 8px;
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  .cell-readonly:active { background: var(--raised); }
  /* Reps behind frosted glass: blurred placeholder digits */
  .cell-masked,
  .cell-masked:active {
    color: transparent;
    text-shadow: 0 0 8px var(--ink2);
    background: rgba(255, 255, 255, 0.1);
    border-radius: 8px;
  }
  .cell-edit-input {
    background: var(--raised); border: 1.5px solid var(--ink); border-radius: 8px;
    padding: 6px; text-align: center; font-size: 16px; width: 60px; outline: none;
  }

  .rest-display { font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 500; color: var(--ink2); }
  .rest-display.live { color: var(--ink); font-weight: 700; font-size: 14px; }
  .rest-display.rest-reference { opacity: 0.55; }

  .action-cell-wrap { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
  .btn-action {
    min-width: 76px; min-height: 36px; padding: 0 10px;
    background: var(--ink); color: #000;
    border: 0; border-radius: 999px; font-size: 13px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    transition: transform 120ms ease-out;
  }
  .btn-action:active { transform: scale(.95); }
  .btn-action:disabled { cursor: default; transform: none; }
  .btn-action.stop-rest { animation: pulse-resting 1.5s ease-in-out infinite; }
  .btn-action.done-indicator { background: none; color: var(--col, var(--ink2)); font-size: 18px; }
  .set-row.pending .btn-action.done-indicator { color: var(--ink2); }
  .btn-del-set {
    width: 24px; height: 24px; flex-shrink: 0;
    border: 0; border-radius: 50%; background: none; color: var(--ink2);
    font-size: 11px; line-height: 1; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn-del-set:active { background: var(--raised); color: var(--danger); }
  @keyframes pulse-resting {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.35); }
    50% { box-shadow: 0 0 0 6px rgba(255, 255, 255, 0); }
  }

  .btn-add-set {
    display: block; width: 100%; margin-top: 10px; padding: 10px;
    background: none; border: 1px dashed rgba(255, 255, 255, 0.2); border-radius: 12px;
    color: var(--ink2); font-size: 13px; font-weight: 500;
  }
  .btn-add-set:active { background: var(--raised); }

  /* Exercise note: grows with its text. The hidden ::after copy of the text
     sizes the grid cell, and the textarea fills that cell. */
  .exercise-note-wrap { display: grid; margin-top: 10px; }
  .exercise-note-wrap::after { content: attr(data-value) ' '; white-space: pre-wrap; word-break: break-word; visibility: hidden; }
  .exercise-note,
  .exercise-note-wrap::after {
    grid-area: 1 / 1 / 2 / 2;
    min-height: 40px; padding: 9px 12px;
    font-size: 14px; line-height: 1.5; font-family: inherit;
    border: 1px solid transparent; border-radius: 12px;
  }
  .exercise-note { resize: none; overflow: hidden; width: 100%; background: var(--raised); outline: none; }
  .exercise-note:focus { border-color: rgba(255, 255, 255, 0.5); }
  .exercise-note::placeholder { color: var(--ink2); opacity: 0.7; }

  #workout-footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
    padding: 12px 16px max(14px, env(safe-area-inset-bottom));
    background: rgba(0, 0, 0, 0.82);
    -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  }
  .footer-inner { max-width: 528px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .btn-add-exercise {
    width: 100%; min-height: 46px;
    background: var(--card); border: 0; border-radius: 18px; font-weight: 600;
  }
  .btn-end-workout {
    width: 100%; min-height: 54px;
    background: var(--raised); color: var(--ink);
    border: 0; border-radius: 999px; font-size: 16px; font-weight: 700;
    transition: background 180ms ease-out, color 180ms ease-out, transform 120ms ease-out;
  }
  .btn-end-workout.ready { background: var(--ink); color: #000; }
  .btn-end-workout:active { transform: scale(.98); }

  /* ───── Sheets ───── */
  .overlay {
    display: none;
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.62);
    align-items: flex-end; justify-content: center;
  }
  .overlay.open { display: flex; }
  .sheet-box {
    width: 100%; max-width: 430px; max-height: 92dvh; overflow-y: auto;
    padding: 22px 16px max(20px, env(safe-area-inset-bottom));
    background: var(--card);
    border-radius: 22px 22px 0 0;
    animation: rise 260ms cubic-bezier(.2, .8, .2, 1);
  }
  @keyframes rise { from { transform: translateY(32px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-title, .confirm-title { margin: 0 0 4px; font-size: 20px; font-weight: 700; text-align: center; }
  .modal-title { margin-bottom: 16px; }
  .confirm-msg, .sheet-hint { margin: 0 0 16px; font-size: 13px; line-height: 1.5; color: var(--ink2); text-align: center; }
  .sheet-hint:empty, .auth-hint:empty, .auth-error:empty, .sheet-error:empty { display: none; }
  .modal-field { margin-bottom: 14px; }
  .modal-label { display: block; margin-bottom: 7px; font-size: 13px; color: var(--ink2); }
  .modal-input {
    width: 100%; min-height: 48px; padding: 0 14px;
    background: var(--raised); border: 0; border-radius: 12px;
    font-size: 16px; outline: none;
  }
  textarea.modal-input { padding: 12px 14px; min-height: 120px; resize: none; }
  .modal-input::placeholder { color: #8e8e93; }
  .modal-input:focus { box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.5); }
  .sheet-error, .auth-error { min-height: 18px; margin: 6px 0 0; font-size: 13px; color: var(--danger); text-align: center; }
  .modal-btns, .confirm-btns { display: flex; gap: 8px; margin-top: 20px; }
  .modal-cancel, .confirm-cancel, .menu-cancel {
    flex: 1; min-height: 50px;
    background: var(--raised); color: var(--ink);
    border: 0; border-radius: 999px; font-weight: 600;
  }
  .modal-confirm, .confirm-ok {
    flex: 1; min-height: 50px;
    background: var(--ink); color: #000;
    border: 0; border-radius: 999px; font-weight: 700;
    transition: transform 120ms ease-out;
  }
  .modal-confirm:active, .confirm-ok:active { transform: scale(.98); }
  .modal-confirm:disabled { opacity: 0.4; }

  .history { margin-top: 6px; text-align: left; }
  .h-work { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
  .h-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
  .h-time { font-size: 13px; font-weight: 500; color: var(--ink2); }
  .h-ex { margin-top: 10px; }
  .h-name { font-weight: 600; overflow-wrap: anywhere; }
  .h-sets { margin-top: 2px; font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
  .h-note { margin-top: 4px; font-size: 13px; line-height: 1.5; color: var(--ink2); white-space: pre-wrap; overflow-wrap: anywhere; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    min-height: 40px; padding: 0 14px;
    background: var(--raised); border: 0; border-radius: 999px;
    font-size: 14px; color: var(--ink2);
    transition: background 140ms ease-out, color 140ms ease-out;
  }
  .chip[aria-pressed="true"], .chip[aria-checked="true"] { background: var(--ink); color: #000; font-weight: 600; }

  #exercise-menu-box { display: flex; flex-direction: column; gap: 8px; }
  .menu-item {
    width: 100%; min-height: 50px; padding: 0 16px;
    background: var(--raised); border: 0; border-radius: 14px;
    font-weight: 500; text-align: left;
  }
  .menu-item-danger { color: var(--danger); }
  .menu-cancel { flex: none; width: 100%; margin-top: 4px; }

  #toast {
    position: fixed; z-index: 120; left: 50%; bottom: calc(max(10px, env(safe-area-inset-bottom)) + 56px); /* above the sync bar */
    transform: translate(-50%, 14px);
    display: flex; align-items: center; gap: 6px;
    max-width: calc(100vw - 32px); padding: 12px 18px;
    background: var(--raised); color: var(--ink);
    border-radius: 999px; font-size: 14px; font-weight: 600; line-height: 1.4; white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 200ms ease-out, transform 200ms cubic-bezier(.2, .9, .3, 1.2);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ───── Sync status ───── */
  #sync-bar {
    position: fixed; left: 50%; bottom: max(10px, env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 60;
    width: max-content; max-width: calc(100vw - 24px);
    display: flex; align-items: center; gap: 10px;
    padding: 7px 12px;
    background: rgba(28, 28, 30, 0.94);
    border-radius: 14px;
    font-size: 12px; color: var(--ink2); line-height: 1.4;
  }
  body.on-workout #sync-bar { display: none; }
  #sync-bar.hidden, #sync-status:empty { display: none; }
  #btn-login {
    flex-shrink: 0; min-height: 30px; padding: 0 12px;
    background: var(--ink); color: #000;
    border: 0; border-radius: 999px; font-size: 13px; font-weight: 700;
  }
  .auth-hint { font-size: 13px; color: var(--ink2); text-align: center; margin: -8px 0 16px; }
  .auth-links { display: flex; justify-content: center; gap: 20px; margin-top: 16px; }
  .auth-links button { background: none; border: 0; color: var(--ink2); font-size: 14px; padding: 6px; text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- ═══════════════════════════ HOME PAGE ═══════════════════════════ -->
<div id="page-home">
  <main class="home-wrap">
    <div class="top">
      <h1>Show Up</h1>
      <button id="btn-lang" class="lang-toggle" onclick="toggleLang()" data-i18n="langToggle">English</button>
    </div>
    <div class="sum" id="heat-sum"></div>
    <div class="heat-scroll" id="heat-scroll"><div class="heat" id="heat" role="group"></div></div>
    <h2 data-i18n="startTraining">开始训练</h2>
    <div class="parts" id="parts"></div>
    <div class="home-foot">
      <button class="link-btn" id="btn-import" onclick="openImport()" data-i18n="importOld">导入旧 App 数据</button>
    </div>
  </main>
</div>

<!-- ═══════════════════════════ WORKOUT PAGE ═══════════════════════════ -->
<div id="page-workout">
  <div id="workout-header">
    <button id="btn-back" onclick="goHome()" data-i18n-aria="back" aria-label="返回">
      <svg viewBox="0 0 12 20" aria-hidden="true"><path d="M10 2L2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="w-title"><i class="key" id="workout-key"></i><span id="workout-title">训练</span></div>
    <div id="global-timer">00:00:00</div>
  </div>

  <div id="exercises-container"></div>

  <div id="workout-footer">
    <div class="footer-inner">
      <button class="btn-add-exercise" onclick="openAddModal()" data-i18n="addExercise">＋ 添加动作</button>
      <button class="btn-end-workout" onclick="endWorkout()" data-i18n="endWorkout">结束训练</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════ EXERCISE MENU ═══════════════════════════ -->
<div id="exercise-menu-overlay" class="overlay">
  <div id="exercise-menu-box" class="sheet-box">
    <button class="menu-item" onclick="renameExercisePrompt()" data-i18n="renameExercise">重命名动作</button>
    <button class="menu-item menu-item-danger" onclick="deleteExerciseConfirm()" data-i18n="deleteExercise">删除动作</button>
    <button class="menu-cancel" onclick="closeExerciseMenu()" data-i18n="cancel">取消</button>
  </div>
</div>

<!-- ═══════════════════════════ END WORKOUT CONFIRM ═══════════════════════════ -->
<div id="end-confirm-overlay" class="overlay">
  <div class="sheet-box">
    <div class="confirm-title" data-i18n="endConfirmTitle">结束本次训练？</div>
    <div class="confirm-msg" data-i18n="endConfirmMsg">当前数据将保存为下次训练的模板。</div>
    <div class="confirm-btns">
      <button class="confirm-cancel" onclick="cancelEndWorkout()" data-i18n="cancel">取消</button>
      <button class="confirm-ok" onclick="confirmEndWorkout()" data-i18n="endConfirmOk">确定结束</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════ ADD EXERCISE ═══════════════════════════ -->
<div id="modal-overlay" class="overlay">
  <div id="modal-box" class="sheet-box">
    <div class="modal-title" data-i18n="addExerciseTitle">添加动作</div>
    <div class="modal-field">
      <label class="modal-label" for="modal-name" data-i18n="exerciseName">动作名称</label>
      <input class="modal-input" id="modal-name" type="text" placeholder="例：平板卧推" data-i18n-placeholder="exerciseNamePlaceholder" autocomplete="off">
    </div>
    <div class="modal-field">
      <label class="modal-label" for="modal-sets" data-i18n="setsLabel">组数</label>
      <input class="modal-input" id="modal-sets" type="number" inputmode="decimal" placeholder="6" min="1" max="20">
    </div>
    <div class="modal-field">
      <div class="modal-label" id="modal-parts-label" data-i18n="exercisePart">这个动作练哪个部位</div>
      <div class="chips" id="modal-parts" role="radiogroup" aria-labelledby="modal-parts-label"></div>
    </div>
    <div class="modal-btns">

//  STATE
// ═══════════════════════════════════════════════════
const STORAGE_KEY = 'showup:state';

// Colour only ever means a body part. Every pair stays apart on the dark surface, for colour-blind eyes too
// (checked with dataviz validate_palette --mode dark --surface "#1c1c1e" --pairs all). Parts past the seventh share grey.
const PALETTE = ['#c03809', '#bf8532', '#205bf7', '#00aa95', '#047745', '#8f81e8', '#9f40a8'];
const OTHER_COLOR = '#8e8e93';
// The three parts every install starts with; their colours never move.
const BUILTIN_PARTS = ['chest', 'shoulders', 'back'];

// state.routines[partId]  { displayName, color, lastTrainedAt, exercises: [{ name, note, sets, part? }] }
//   `part`: the part the exercise trains, when it isn't the one whose card it sits in.
// state.partOrder         part ids in the order the home page shows them (user_state is jsonb: key order isn't kept)
// state.logs[partId]      ['YYYY-MM-DD', ...] days that part was trained; the same day may appear twice (old app taps)
function defaultState() {
  return {
    routines: {
      chest:     { displayName: '胸', color: PALETTE[0], lastTrainedAt: null, exercises: [] },
      shoulders: { displayName: '肩', color: PALETTE[1], lastTrainedAt: null, exercises: [] },
      back:      { displayName: '背', color: PALETTE[2], lastTrainedAt: null, exercises: [] }
    },
    partOrder: ['chest', 'shoulders', 'back'],
    logs: {},
    activeSession: null
  };
}

let state = defaultState();

// Every change the user makes goes through here, so it also marks the data as not yet in the cloud.
function save() {
  writeState();
  markChanged();
}

function writeState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

// The first colour in the palette no part has, grey once they're all taken.
function nextPartColor(routines) {
  const used = Object.values(routines).map(r => r.color);
  return PALETTE.find(c => !used.includes(c)) || OTHER_COLOR;
}

// Data saved before parts existed: no colours, no order, no logs. Saved data is taken as it is, so a part
// that isn't there stays gone; the three starting parts are only added on the very first run (defaultState).
function withDefaults(parsed) {
  const s = { ...defaultState(), ...parsed };
  s.routines = parsed.routines || defaultState().routines;
  s.logs = parsed.logs || {};
  const keys = Object.keys(s.routines);
  const saved = (parsed.partOrder || []).filter(k => s.routines[k]);
  // Without a saved order (jsonb sorts keys by length, then alphabet): the starting parts in their own order, then the rest.
  const rest = keys.filter(k => !saved.includes(k));
  s.partOrder = [...saved, ...BUILTIN_PARTS.filter(k => rest.includes(k)), ...rest.filter(k => !BUILTIN_PARTS.includes(k))];
  s.partOrder.forEach(k => {
    const r = s.routines[k];
    if (r.color) return;
    r.color = BUILTIN_PARTS.includes(k) ? PALETTE[BUILTIN_PARTS.indexOf(k)] : nextPartColor(s.routines);
  });
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = withDefaults(JSON.parse(raw));
  } catch(e) {}
  loadSync();
}

function isEmpty(s) {
  return !s.activeSession &&
    Object.values(s.routines).every(r => !r.exercises.length) &&
    Object.keys(s.routines).every(k => BUILTIN_PARTS.includes(k)) &&
    !Object.values(s.logs || {}).some(days => days.length);
}

// Check-ins merge by day, keeping the larger count for each, so neither side's days are lost.
function mergeLogs(a, b) {
  const tally = days => (days || []).reduce((c, d) => { c[d] = (c[d] || 0) + 1; return c; }, {});
  const out = {};
  for (const id of new Set([...Object.keys(a || {}), ...Object.keys(b || {})])) {
    const ca = tally((a || {})[id]), cb = tally((b || {})[id]);
    out[id] = [...new Set([...Object.keys(ca), ...Object.keys(cb)])].sort()
      .flatMap(d => Array(Math.max(ca[d] || 0, cb[d] || 0)).fill(d));
  }
  return out;
}

// Local calendar days. Date.now() and not new Date(): the tests move the clock through Date.now.
const pad2 = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
function todayDate() { const d = new Date(Date.now()); d.setHours(0, 0, 0, 0); return d; }
function shiftDays(base, days) { return new Date(base.getFullYear(), base.getMonth(), base.getDate() + days); }

function navigate(routineKey) { window.location.hash = routineKey; }

function render() {
  const hash = currentHash();
  const home = document.getElementById('page-home');
  const workout = document.getElementById('page-workout');

  endStaleSession();
  if (Object.prototype.hasOwnProperty.call(state.routines, hash)) {
    if (!enterRoutine(hash)) { goHome(); return; }
    home.style.display = 'none';
    workout.style.display = 'block';
    document.body.classList.add('on-workout');
    renderWorkout();
  } else {
    home.style.display = 'block';
    workout.style.display = 'none';
    document.body.classList.remove('on-workout');
    stopTimers();
    renderHome();
  }
}

const PX = 22, PY = 22, MONTH_H = 20;
let heatCells = [];
let pendingLit = null; // parts just checked in: their tiles spring in once the home page is drawn

const keyHtml = c => `<i class="key" style="--col:${c}" data-color="${c}"></i>`;
const reducedMotion = () => !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

function partIds() { return state.partOrder.filter(id => state.routines[id]); }
function partColor(id) { return (state.routines[id] || {}).color || OTHER_COLOR; }
function partsOn(iso) { return partIds().filter(id => (state.logs[id] || []).includes(iso)); }

// Diagonal bands of equal area: a corner triangle cut at t along the diagonal covers 2t².
function bandEdge(area) { return area < 0.5 ? Math.sqrt(area / 2) : 1 - Math.sqrt((1 - area) / 2); }
function tileFill(colors) {
  const n = colors.length;
  if (!n) return '';
  if (n === 1) return colors[0];
  const GAP = 1.7; // percent either side: a hairline of black between bands
  const stops = colors.map((c, i) => {
    const from = i === 0 ? 0 : bandEdge(i / n) * 100 + GAP;
    const to = i === n - 1 ? 100 : bandEdge((i + 1) / n) * 100 - GAP;
    const after = i === n - 1 ? '' : `,#000 ${to.toFixed(2)}% ${(bandEdge((i + 1) / n) * 100 + GAP).toFixed(2)}%`;
    return `${c} ${from.toFixed(2)}% ${to.toFixed(2)}%${after}`;
  });
  return `linear-gradient(135deg,${stops.join(',')})`;
}

function parseIso(iso) { const [y, m, d] = iso.split('-').map(Number); return { y, m: m - 1, d }; }
function dayText(iso) { const { m, d } = parseIso(iso); return t('dayLabel', m, d); }

// The last six months, a column per week (Monday first), scrollable. Today sits 75% across when it opens.
function buildHeat() {
  const scroller = document.getElementById('heat-scroll');
  const heat = document.getElementById('heat');
  const W = scroller.clientWidth;
  const today = todayDate();
  const todayIso = isoOf(today);
  const from = new Date(today);
  from.setMonth(from.getMonth() - 6);
  from.setDate(from.getDate() - (from.getDay() + 6) % 7);
  const pastCols = Math.floor(Math.round((today - from) / 864e5) / 7) + 1;
  const futureCols = Math.max(2, Math.ceil(0.25 * W / PX));

  heat.innerHTML = '';
  heat.style.width = (pastCols + futureCols) * PX - 4 + 'px';
  heat.style.height = MONTH_H + 7 * PY - 4 + 'px';
  heatCells = [];
  let lastMonth = -1;
  for (let c = 0; c < pastCols + futureCols; c++) {
    for (let r = 0; r < 7; r++) {
      const d = shiftDays(from, c * 7 + r);
      const iso = isoOf(d);
      if (r === 0 && d.getMonth() !== lastMonth) {
        lastMonth = d.getMonth();
        if (c > 0) {
          const m = document.createElement('span');
          m.className = 'month';
          m.style.left = c * PX + 'px';
          m.textContent = t('monthLabel', d.getMonth());
          heat.appendChild(m);
        }
      }
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'd';
      b.dataset.iso = iso;
      b.style.left = c * PX + 'px';
      b.style.top = MONTH_H + r * PY + 'px';
      if (iso > todayIso) {
        b.classList.add('future');
        b.disabled = true;
        b.setAttribute('aria-hidden', 'true');
      } else {
        if (iso === todayIso) b.classList.add('today');
        b.onclick = () => openDay(iso);
        heatCells.push({ b, iso });
      }
      heat.appendChild(b);
    }
  }
  paintHeat();
  scroller.scrollLeft = (pastCols - 1) * PX + 9 + 16 - 0.75 * W;
}

// Colours the tiles and the part cards from state.logs.
function paintHeat() {
  const todayIso = isoOf(todayDate());
  const cut = todayDate();
  cut.setMonth(cut.getMonth() - 6);
  const cutoff = isoOf(cut);
  const trained = new Set();
  heatCells.forEach(({ b, iso }) => {
    const on = partsOn(iso);
    if (on.length && iso >= cutoff) trained.add(iso);
    const names = on.map(routineName);
    b.style.background = tileFill(on.map(partColor));
    b.dataset.parts = names.join('|');
    b.setAttribute('aria-label', `${dayText(iso)} ${names.join(t('join'))}`.trim());
  });
  const sum = t('heatSum', trained.size);
  document.getElementById('heat-sum').textContent = sum;
  document.getElementById('heat').setAttribute('aria-label', sum);
  renderParts(todayIso);
}

function whenLabel(id, todayIso) {
  if (state.activeSession && state.activeSession.routineKey === id) return { text: t('inProgress'), now: true };
  const days = [...new Set(state.logs[id] || [])].sort();
  if (!days.length) return { text: t('notYet') };
  const { y, m, d } = parseIso(days[days.length - 1]);
  const ago = Math.round((todayDate() - new Date(y, m, d)) / 864e5);
  if (ago <= 0) return { text: t('today'), now: true };
  if (ago === 1) return { text: t('yesterday') };
  return { text: t('daysAgo', ago) };
}

function renderParts(todayIso) {
  const box = document.getElementById('parts');
  box.innerHTML = '';
  const today = todayDate();
  partIds().forEach(id => {
    const color = partColor(id);
    const when = whenLabel(id, todayIso);
    const days = state.logs[id] || [];
    let strip = '';
    for (let i = 13; i >= 0; i--) {
      const on = days.includes(isoOf(shiftDays(today, -i)));
      strip += `<span class="m${on ? ' on' : ''}${i === 0 ? ' today' : ''}" style="--col:${color}"></span>`;
    }
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'part';
    b.dataset.id = id;
    b.setAttribute('aria-label', t('ariaRoutine', routineName(id)));
    b.innerHTML =
      `<span class="part-name">${keyHtml(color)}<span>${esc(routineName(id))}</span></span>` +
      `<span class="part-when${when.now ? ' now' : ''}">${esc(when.text)}</span>` +
      `<span class="strip" aria-hidden="true">${strip}</span>`;
    b.onclick = () => navigate(id);
    box.appendChild(b);
  });
  const add = document.createElement('button');
  add.type = 'button';
  add.className = 'add-part';
  add.id = 'btn-add-part';
  add.textContent = t('addPart');
  add.onclick = openAddPart;
  box.appendChild(add);
}

function renderHome() {
  buildHeat();
  if (pendingLit) { lightUp(pendingLit); pendingLit = null; }
}

// The one big moment: today's tile springs in, then the same day on each part's strip.
function lightUp(ids) {
  if (reducedMotion()) return;
  const today = heatCells.find(c => c.iso === isoOf(todayDate()));
  if (today) today.b.classList.add('pop');
  ids.forEach((id, n) => {
    const mini = document.querySelector(`.part[data-id="${id}"] .m.today`);
    if (mini) {
      mini.style.setProperty('--delay', 180 + n * 120 + 'ms');
      mini.classList.add('pop');
    }
  });
}

let toastTimer = null;
function toast(msg, colors) {
  const el = document.getElementById('toast');
  el.innerHTML = (colors || []).map(keyHtml).join('') + `<span>${esc(msg)}</span>`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

function overlayClosesOnOutsideTap(id, close) {
  const el = document.getElementById(id);
  el.addEventListener('click', e => { if (e.target === el) close(); });
}

// ───── a day: add or remove a check-in by hand ─────
let dayIso = null;

function openDay(iso) {
  dayIso = iso;
  drawDay();
  document.getElementById('day-overlay').classList.add('open');
  loadHistory();
}

function closeDay() {
  dayIso = null;
  document.getElementById('day-overlay').classList.remove('open');
}

function drawDay() {
  const label = dayText(dayIso);
  document.getElementById('day-title').textContent = dayIso === isoOf(todayDate()) ? t('todayDate', label) : label;
  document.getElementById('day-hint').textContent = t(partsOn(dayIso).length ? 'dayOn' : 'dayOff');
  const box = document.getElementById('day-chips');
  box.innerHTML = '';
  partIds().forEach(id => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.dataset.id = id;
    chip.setAttribute('aria-pressed', String((state.logs[id] || []).includes(dayIso)));
    chip.innerHTML = `${keyHtml(partColor(id))}${esc(routineName(id))}`;
    chip.onclick = () => toggleDayPart(id);
    box.appendChild(chip);
  });
  drawHistory();
}

// ───── what was trained on a day, from the workout history ─────
// Every ended workout is kept whole (names, weights, reps, notes) in the cloud and, until it's uploaded, in `pending`.
// Workouts under 5 minutes are left out: opening a part by mistake saves one too.
const MIN_WORKOUT_MS = 5 * 60 * 1000;
let cloudWorkouts = [];

async function loadHistory() {
  if (!signedIn) return;
  try { cloudWorkouts = await cloud.pullWorkouts(); } catch(e) { return; }
  if (dayIso) drawHistory();
}

function dayWorkouts(iso) {
  const all = [...cloudWorkouts, ...pending.filter(w => !cloudWorkouts.some(c => c.clientId === w.clientId))];
  return all
    .filter(w => w.exercises.length && w.endedAt - w.startedAt >= MIN_WORKOUT_MS && isoOf(new Date(w.startedAt)) === iso)
    .sort((a, b) => a.startedAt - b.startedAt);
}

function drawHistory() {
  const box = document.getElementById('day-history');
  const works = dayWorkouts(dayIso);
  box.innerHTML = '';
  if (!works.length) return;
  const head = document.createElement('div');
  head.className = 'modal-label';
  head.style.marginTop = '18px';
  head.textContent = t('dayHistory');
  box.appendChild(head);
  works.forEach(w => {
    const time = new Date(w.startedAt);
    const el = document.createElement('div');
    el.className = 'h-work';
    el.innerHTML = `<div class="h-title">${keyHtml(partColor(w.routineKey))}${esc(routineName(w.routineKey))}` +
      `<span class="h-time">${pad2(time.getHours())}:${pad2(time.getMinutes())}</span></div>` +
      w.exercises.map(ex =>
        `<div class="h-ex"><div class="h-name">${esc(ex.name)}</div>` +
        `<div class="h-sets">${ex.sets.map(x => `${x.weight || 0}×${x.reps || 0}`).join('  ')}</div>` +
        (ex.note ? `<div class="h-note">${esc(ex.note)}</div>` : '') + `</div>`).join('');
    box.appendChild(el);
  });
}

function toggleDayPart(id) {
  const days = state.logs[id] || [];
  state.logs[id] = days.includes(dayIso) ? days.filter(d => d !== dayIso) : [...days, dayIso];
  save();
  paintHeat();
  drawDay();
  const chip = document.querySelector(`#day-chips .chip[data-id="${id}"]`);
  if (chip) chip.focus();
}

// ───── adding a part ─────
// A part is found by the name it shows, in either language.
function findPartByName(name) {
  const want = name.trim().toLowerCase();
  return partIds().find(id => [
    state.routines[id].displayName, STRINGS.zh.routines[id], STRINGS.en.routines[id]
  ].some(n => n && n.toLowerCase() === want));
}

function addPartNamed(name) {
  let id;
  do { id = 'p' + newId().replace(/-/g, '').slice(0, 8); } while (state.routines[id]);
  state.routines[id] = { displayName: name, color: nextPartColor(state.routines), lastTrainedAt: null, exercises: [] };
  state.partOrder.push(id);
  return id;
}

function openAddPart() {
  document.getElementById('part-name').value = '';
  document.getElementById('part-error').textContent = '';
  document.getElementById('addpart-overlay').classList.add('open');
  setTimeout(() => document.getElementById('part-name').focus(), 100);
}

function closeAddPart() {
  document.getElementById('addpart-overlay').classList.remove('open');
}

function confirmAddPart() {
  const name = document.getElementById('part-name').value.trim();
  if (!name) return;
  if (findPartByName(name)) {
    document.getElementById('part-error').textContent = t('partDup', name);
    return;
  }
  addPartNamed(name);
  save();
  closeAddPart();
  renderHome();
  toast(t('partAdded', name));
}

document.getElementById('part-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); confirmAddPart(); }
});
overlayClosesOnOutsideTap('day-overlay', closeDay);
overlayClosesOnOutsideTap('addpart-overlay', closeAddPart);
overlayClosesOnOutsideTap('import-overlay', closeImport);

// ───── bringing over the old Gym Log app's data ─────
// The old app lived at another address, so its data can't be read from here: it copies everything as text
// ({ sections: [{ id, name }], logs: { id: ['YYYY-MM-DD', ...] } }) and it's pasted in.
const OLD_APP_PARTS = { chest: 'chest', back: 'back', shoulder: 'shoulders' };

// Returns [{ id, name, days }], or null when the text isn't the old app's data.
function parseOldApp(text) {
  let d;
  try { d = JSON.parse(text); } catch(e) { return null; }
  if (!d || !Array.isArray(d.sections) || !d.logs || typeof d.logs !== 'object') return null;
  const parts = [];
  d.sections.forEach(sec => {
    if (!sec || typeof sec.id !== 'string' || !sec.id || parts.some(p => p.id === sec.id)) return;
    if (typeof sec.name !== 'string' || !sec.name.trim()) return;
    const days = Array.isArray(d.logs[sec.id]) ? d.logs[sec.id].filter(x => typeof x === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(x)) : [];
    parts.push({ id: sec.id, name: sec.name.trim().slice(0, 10), days });
  });
  return parts.length ? parts : null;
}

// Chest, back and shoulder go to the parts that are already here; anything else matches by name or becomes
// a new part. Days merge, so importing twice changes nothing. Returns how many check-ins were in the data.
function importOldApp(parts) {
  let total = 0;
  parts.forEach(p => {
    let id = OLD_APP_PARTS[p.id];
    if (!id || !state.routines[id]) id = findPartByName(p.name) || addPartNamed(p.name);
    state.logs = mergeLogs(state.logs, { [id]: p.days });
    total += p.days.length;
  });
  return total;
}

let importParsed = null;

function openImport() {
  document.getElementById('import-text').value = '';
  onImportInput();
  document.getElementById('import-overlay').classList.add('open');
}

function closeImport() {
  document.getElementById('import-overlay').classList.remove('open');
}

function onImportInput() {
  const text = document.getElementById('import-text').value.trim();
  importParsed = text ? parseOldApp(text) : null;
  const summary = document.getElementById('import-summary');
  if (!text) summary.textContent = '';
  else if (!importParsed) summary.textContent = t('importBad');
  else summary.textContent = t('importSummary', importParsed.length, importParsed.reduce((n, p) => n + p.days.length, 0));
  document.getElementById('import-confirm').disabled = !importParsed;
}

function confirmImport() {
  if (!importParsed) return;
  const total = importOldApp(importParsed);
  save();
  closeImport();
  renderHome();
  toast(t('imported', total));
}

document.getElementById('import-text').addEventListener('input', onImportInput);

// ═══════════════════════════════════════════════════
//  SESSION MANAGEMENT
// ═══════════════════════════════════════════════════
const SESSION_MAX_MS = 4 * 60 * 60 * 1000;

// No real workout lasts this long: it was finished but never ended.
function isStale(ses) {
  return Date.now() - ses.startedAt > SESSION_MAX_MS;
}

function endStaleSession() {
  if (state.activeSession && isStale(state.activeSession)) finishSession();
}

// Last time's weight and reps, kept only while the workout runs to tell whether a set improved.
// Sets without last-time reps get none, so they're never hidden.
function withPrev(set) {
  if (set.reps > 0) set.prev = { weight: set.weight, reps: set.reps };
  return set;
}

// Reps stay behind frosted glass until the set is revealed, so last time's number isn't a ceiling.
function isMasked(set) {
  return !!set.prev && !set.revealed;
}

// Returns false if the user chose to keep the other routine's workout going.
function enterRoutine(routineKey) {
  const ses = state.activeSession;
  if (ses && ses.routineKey === routineKey) {
    startTimers();
    return true;
  }
  if (ses) {
    if (!confirm(t('switchRoutine', routineName(ses.routineKey), routineName(routineKey)))) return false;
    finishSession();
  }

  const routine = state.routines[routineKey];
  const templateExercises = JSON.parse(JSON.stringify(routine.exercises));
  const sessionExercises = templateExercises.map(ex => ({
    name: ex.name,
    ...(ex.part ? { part: ex.part } : {}),
    note: ex.note || '',
    sets: ex.sets.map(s => withPrev({
      weight: s.weight || 0,
      reps: s.reps || 0,
      restSeconds: s.restSeconds ?? null
    }))
  }));

  state.activeSession = {
    routineKey,
    startedAt: Date.now(),
    exercises: sessionExercises,
    currentSetCursors: {},
    restingState: null
  };

  sessionExercises.forEach((_, i) => {
    state.activeSession.currentSetCursors[i] = 0;
  });

  save();
  startTimers();
  return true;
}

// ═══════════════════════════════════════════════════
//  TIMERS
// ═══════════════════════════════════════════════════
let timerInterval = null;

function startTimers() {
  stopTimers();
  timerInterval = setInterval(updateTimers, 1000);
  updateTimers();
}

function stopTimers() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function formatHMS(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return [h,m,s].map(v => String(v).padStart(2,'0')).join(':');
}

function formatMS(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return m + ':' + String(s).padStart(2,'0');
}

function updateTimers() {
  const ses = state.activeSession;
  if (!ses) return;
  // App was left open (e.g. suspended in the background): save it and start fresh.
  if (isStale(ses)) { render(); return; }

  const elapsed = Math.floor((Date.now() - ses.startedAt) / 1000);
  const timerEl = document.getElementById('global-timer');
  if (timerEl) timerEl.textContent = formatHMS(elapsed);

  if (ses.restingState) {
    const { exerciseIndex, setIndex, restStartedAt } = ses.restingState;
    const restElapsed = Math.floor((Date.now() - restStartedAt) / 1000);
    const cell = document.getElementById(`rest-cell-${exerciseIndex}-${setIndex}`);
    if (cell) {
      cell.textContent = formatMS(restElapsed);
      cell.className = 'rest-display live';
    }
  }
}

// ═══════════════════════════════════════════════════
//  CELL EDIT
// ═══════════════════════════════════════════════════
function startCellEdit(spanEl, exIdx, setIdx, field) {
  const ses = state.activeSession;
  if (!ses) return;
  if (field === 'rest' && ses.restingState &&
      ses.restingState.exerciseIndex === exIdx &&
      ses.restingState.setIndex === setIdx) return;

  const set = ses.exercises[exIdx].sets[setIdx];
  if (field === 'reps' && isMasked(set)) {
    // Only the current or a finished set opens, so a stray tap can't peek ahead.
    if (setIdx > (ses.currentSetCursors[exIdx] ?? 0)) return;
    // Opening the glass sticks, so it's saved before `original`: Escape must not mask it again.
    set.revealed = true;
    spanEl.classList.remove('cell-masked');
    spanEl.textContent = set.reps || 0;
    // Weight raised beforehand and last time's reps done: that's already progress.
    revealIfImproved(ses.exercises[exIdx], exIdx);
    save();
  }
  const original = { ...set };
  const inp = document.createElement('input');
  inp.type = 'number';
  inp.inputMode = 'decimal';
  inp.className = 'cell-edit-input';
  if (field === 'rest') {
    inp.style.width = '56px';
    inp.value = set.restSeconds ?? 0;
  } else {
    // From the set, not the cell: a masked cell only shows placeholder digits.
    inp.value = set[field] || 0;
  }
  // Save every keystroke: on iOS tapping a button doesn't blur the input,
  // so the next re-render (or ending the workout) can drop it without a blur.
  inp.oninput = () => setCellValue(set, field, inp.value);
  inp.onblur = () => commitCellEdit(inp, spanEl, set, field);
  inp.onkeydown = (e) => {
    if (e.key === 'Enter')  { e.preventDefault(); commitCellEdit(inp, spanEl, set, field); }
    if (e.key === 'Escape') { e.preventDefault(); cancelCellEdit(inp, spanEl, set, original); }
  };
  spanEl.replaceWith(inp);
  inp.focus();
  inp.select();
}

function setCellValue(set, field, value) {
  const numVal = parseFloat(value) || 0;
  if (field === 'weight') set.weight = numVal;
  else if (field === 'reps') set.reps = Math.round(numVal);
  else if (field === 'rest') set.restSeconds = Math.round(numVal);
  const ses = state.activeSession;
  // By reference, not index: deleting a set shifts the indexes.
  // No session when the input blurs late, after the workout already ended.
  const exIdx = ses ? ses.exercises.findIndex(e => e.sets.includes(set)) : -1;
  if (exIdx >= 0) revealIfImproved(ses.exercises[exIdx], exIdx);
  save();
}

function isImproved(set) {
  const { prev } = set;
  return !!prev && ((set.weight === prev.weight && set.reps > prev.reps) ||
                    (set.weight > prev.weight && set.reps >= prev.reps));
}

// One opened set that beat last time is enough for the day: open the glass on the rest of the exercise.
// Cells are updated in place because re-rendering would drop the input being typed in, and the keyboard with it.
// Caller saves.
function revealIfImproved(ex, exIdx) {
  if (!ex.sets.some(s => s.revealed && isImproved(s))) return;
  ex.sets.forEach(s => { if (s.prev) s.revealed = true; });
  const card = document.getElementById(`exercise-card-${exIdx}`);
  if (!card) return;
  card.querySelectorAll('.cell-masked').forEach(span => {
    span.textContent = ex.sets[span.dataset.setIdx].reps || 0;
    span.classList.remove('cell-masked');
  });
}

function commitCellEdit(inp, spanEl, set, field) {
  if (inp._done) return;
  inp._done = true;
  setCellValue(set, field, inp.value);
  const numVal = parseFloat(inp.value) || 0;
  spanEl.textContent = field === 'rest' ? formatMS(Math.round(numVal)) : (numVal || 0);
  inp.replaceWith(spanEl);
}

function cancelCellEdit(inp, spanEl, set, original) {
  if (inp._done) return;
  inp._done = true;
  Object.assign(set, original);
  save();
  inp.replaceWith(spanEl);
}

// ═══════════════════════════════════════════════════
//  RENDER WORKOUT
// ═══════════════════════════════════════════════════
function renderWorkout() {
  const ses = state.activeSession;
  if (!ses) return;

  document.getElementById('workout-title').textContent = t('workoutTitle', routineName(ses.routineKey));
  document.getElementById('workout-key').style.background = partColor(ses.routineKey);
  // The End button turns white once some exercise has all its sets done: that's what will check in.
  document.querySelector('.btn-end-workout').classList.toggle('ready', checkedInParts(ses).length > 0);

  const container = document.getElementById('exercises-container');
  container.innerHTML = '';

  ses.exercises.forEach((ex, exIdx) => {
    const cursor = ses.currentSetCursors[exIdx] ?? 0;
    container.appendChild(buildExerciseCard(ex, exIdx, cursor, ses));
  });

  updateTimers();
}

function buildExerciseCard(ex, exIdx, cursor, ses) {
  const card = document.createElement('div');
  card.className = 'exercise-card';
  card.id = `exercise-card-${exIdx}`;
  // The exercise's colour is its part's, which may not be the part whose card it sits in.
  const partId = exercisePart(ex, ses.routineKey);
  card.style.setProperty('--col', partColor(partId));

  // Header
  const header = document.createElement('div');
  header.className = 'exercise-header';

  const nameSpan = document.createElement('div');
  nameSpan.className = 'exercise-name';
  nameSpan.textContent = ex.name;

  const menuBtn = document.createElement('button');
  menuBtn.className = 'exercise-menu-btn';
  menuBtn.textContent = '⋯';
  menuBtn.onclick = (e) => { e.stopPropagation(); openExerciseMenu(exIdx); };

  const meta = document.createElement('div');
  meta.className = 'ex-meta';
  meta.innerHTML = `<span class="ex-part">${keyHtml(partColor(partId))}${esc(routineName(partId))}</span>`;
  const setsCount = document.createElement('span');
  setsCount.className = 'exercise-sets-count';
  setsCount.textContent = t('setsCount', ex.sets.length);
  meta.appendChild(setsCount);

  // One square per set, lit as each is finished.
  const squares = document.createElement('div');
  squares.className = 'ex-squares';
  squares.setAttribute('role', 'img');
  squares.setAttribute('aria-label', `${Math.min(cursor, ex.sets.length)}/${ex.sets.length}`);
  ex.sets.forEach((_, n) => {
    const sq = document.createElement('span');
    sq.className = 'm' + (n < cursor ? ' on' : '');
    squares.appendChild(sq);
  });

  header.appendChild(nameSpan);
  header.appendChild(menuBtn);
  header.appendChild(meta);
  header.appendChild(squares);
  card.appendChild(header);

  // Table
  const table = document.createElement('table');
  table.className = 'sets-table';
  table.innerHTML = `<thead><tr>
    <th>#</th>
    <th>${t('colWeight')}<br><span style="font-size:10px;opacity:0.6">LBS</span></th>
    <th>${t('colReps')}</th>
    <th>${t('colRest')}</th>
    <th>${t('colAction')}</th>
  </tr></thead>`;

  const tbody = document.createElement('tbody');
  const isLastSet = i => i === ex.sets.length - 1;
  const isResting = ses.restingState &&
    ses.restingState.exerciseIndex === exIdx &&
    ses.restingState.setIndex === cursor;

  ex.sets.forEach((set, setIdx) => {
    const tr = document.createElement('tr');
    let rowClass = 'set-row';
    if (setIdx < cursor) rowClass += ' completed';
    else if (setIdx === cursor) rowClass += isResting ? ' resting' : ' current';
    else rowClass += ' pending';
    tr.className = rowClass;

    // # col
    const tdNum = document.createElement('td');
    tdNum.className = 'cell-num';
    tdNum.textContent = setIdx + 1;
    tr.appendChild(tdNum);

    // Weight col
    tr.appendChild(buildNumCell(set, exIdx, setIdx, 'weight'));
    // Reps col
    tr.appendChild(buildNumCell(set, exIdx, setIdx, 'reps'));

    // Rest col
    tr.appendChild(buildRestCell(set, exIdx, setIdx, cursor, isLastSet(setIdx), isResting, ses));

    // Action col
    tr.appendChild(buildActionCell(setIdx, cursor, exIdx, isLastSet(setIdx), isResting));

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  card.appendChild(table);

  const addSetBtn = document.createElement('button');
  addSetBtn.className = 'btn-add-set';
  addSetBtn.textContent = t('addSet');
  addSetBtn.onclick = () => addSet(exIdx);
  card.appendChild(addSetBtn);

  card.appendChild(buildNote(ex));

  return card;
}

function buildNote(ex) {
  const wrap = document.createElement('div');
  wrap.className = 'exercise-note-wrap';
  wrap.dataset.value = ex.note || '';

  const note = document.createElement('textarea');
  note.className = 'exercise-note';
  note.rows = 1;
  note.placeholder = t('notePlaceholder');
  note.value = ex.note || '';
  // Saved on every keystroke, like the number cells: iOS may not blur before the next tap.
  note.oninput = () => {
    ex.note = note.value;
    wrap.dataset.value = note.value;
    save();
  };
  wrap.appendChild(note);
  return wrap;
}

function buildNumCell(set, exIdx, setIdx, field) {
  const td = document.createElement('td');
  const span = document.createElement('span');
  span.className = 'cell-readonly';
  if (field === 'reps' && isMasked(set)) {
    // Placeholder digits under the glass: the real number isn't on the page at all.
    span.className += ' cell-masked';
    span.textContent = '88';
    span.dataset.setIdx = setIdx;
  } else {
    span.textContent = set[field] || 0;
  }
  span.onclick = (e) => startCellEdit(e.currentTarget, exIdx, setIdx, field);
  td.appendChild(span);
  return td;
}

function buildRestCell(set, exIdx, setIdx, cursor, isLast, isResting, ses) {
  const td = document.createElement('td');

  if (isLast) {
    // Last set: never shows rest
    const span = document.createElement('span');
    span.className = 'rest-display';
    span.style.color = 'var(--muted)';
    span.textContent = '—';
    td.appendChild(span);
    return td;
  }

  if (setIdx === cursor && isResting) {
    // Live timer — not editable
    const span = document.createElement('span');
    span.id = `rest-cell-${exIdx}-${setIdx}`;
    const restElapsed = Math.floor((Date.now() - ses.restingState.restStartedAt) / 1000);
    span.textContent = formatMS(restElapsed);
    span.className = 'rest-display live';
    td.appendChild(span);
    return td;
  }

  if (set.restSeconds !== null && set.restSeconds !== undefined && setIdx < cursor) {
    const span = document.createElement('span');
    span.id = `rest-cell-${exIdx}-${setIdx}`;
    span.className = 'cell-readonly rest-display';
    span.textContent = formatMS(set.restSeconds);
    span.onclick = (e) => startCellEdit(e.currentTarget, exIdx, setIdx, 'rest');
    td.appendChild(span);
    return td;
  }

  if (set.restSeconds !== null && set.restSeconds !== undefined && setIdx >= cursor) {
    // Not yet redone this session: show last recorded value as a reference
    const span = document.createElement('span');
    span.id = `rest-cell-${exIdx}-${setIdx}`;
    span.className = 'rest-display rest-reference';
    span.textContent = formatMS(set.restSeconds);
    td.appendChild(span);
    return td;
  }

  // Empty / pending
  const span = document.createElement('span');
  span.id = `rest-cell-${exIdx}-${setIdx}`;
  span.className = 'rest-display';
  span.textContent = '';
  td.appendChild(span);
  return td;
}

function buildActionCell(setIdx, cursor, exIdx, isLast, isResting) {
  const td = document.createElement('td');
  const wrap = document.createElement('div');
  wrap.className = 'action-cell-wrap';

  const btn = document.createElement('button');
  btn.className = 'btn-action';

  if (setIdx < cursor) {
    btn.textContent = '✓';
    btn.className += ' done-indicator';
    btn.disabled = true;
  } else if (setIdx === cursor) {
    if (isLast) {
      btn.textContent = t('done');
      btn.className += ' complete-set';
      btn.onclick = () => completeLastSet(exIdx);
    } else if (isResting) {
      btn.textContent = t('stopRest');
      btn.className += ' stop-rest';
      btn.onclick = () => stopRest(exIdx);
    } else {
      btn.textContent = t('startRest');
      btn.className += ' start-rest';
      btn.onclick = () => startRest(exIdx);
    }
  } else {
    btn.textContent = '—';
    btn.disabled = true;
    btn.className += ' done-indicator';
  }

  const delBtn = document.createElement('button');
  delBtn.className = 'btn-del-set';
  delBtn.textContent = '✕';
  delBtn.onclick = () => deleteSet(exIdx, setIdx);

  wrap.appendChild(btn);
  wrap.appendChild(delBtn);
  td.appendChild(wrap);
  return td;
}

// ═══════════════════════════════════════════════════
//  REST TIMER ACTIONS
// ═══════════════════════════════════════════════════
function startRest(exIdx) {
  const ses = state.activeSession;
  const cursor = ses.currentSetCursors[exIdx] ?? 0;
  ses.restingState = { exerciseIndex: exIdx, setIndex: cursor, restStartedAt: Date.now() };
  save();
  renderWorkout();
}

function stopRest(exIdx) {
  const ses = state.activeSession;
  if (!ses.restingState) return;
  const { restStartedAt, setIndex } = ses.restingState;
  const restSeconds = Math.round((Date.now() - restStartedAt) / 1000);
  ses.exercises[exIdx].sets[setIndex].restSeconds = restSeconds;
  ses.currentSetCursors[exIdx] = (ses.currentSetCursors[exIdx] ?? 0) + 1;
  ses.restingState = null;
  save();
  renderWorkout();
}

function completeLastSet(exIdx) {
  const ses = state.activeSession;
  const ex = ses.exercises[exIdx];
  const lastIdx = ex.sets.length - 1;
  ex.sets[lastIdx].restSeconds = null;
  ses.currentSetCursors[exIdx] = lastIdx + 1;
  ses.restingState = null;
  save();
  renderWorkout();
}

// ═══════════════════════════════════════════════════
//  SET ADD / DELETE
// ═══════════════════════════════════════════════════
function addSet(exIdx) {
  const ses = state.activeSession;
  const ex = ses.exercises[exIdx];
  const last = ex.sets[ex.sets.length - 1];
  ex.sets.push({
    weight: last ? last.weight || 0 : 0,
    reps: last ? last.reps || 0 : 0,
    restSeconds: null
  });
  save();
  renderWorkout();
}

function deleteSet(exIdx, setIdx) {
  const ses = state.activeSession;
  const ex = ses.exercises[exIdx];

  if (ex.sets.length <= 1) {
    alert(t('keepOneSet'));
    return;
  }
  if (!confirm(t('deleteSetConfirm', setIdx + 1))) return;

  ex.sets.splice(setIdx, 1);

  const cursor = ses.currentSetCursors[exIdx] ?? 0;
  let newCursor = cursor;
  if (setIdx < cursor) newCursor = cursor - 1;
  ses.currentSetCursors[exIdx] = Math.max(0, Math.min(newCursor, ex.sets.length));

  if (ses.restingState && ses.restingState.exerciseIndex === exIdx) {
    if (ses.restingState.setIndex === setIdx) {
      ses.restingState = null;
    } else if (ses.restingState.setIndex > setIdx) {
      ses.restingState.setIndex -= 1;
    }
  }

  save();
  renderWorkout();
}

// ═══════════════════════════════════════════════════
//  ADD EXERCISE MODAL
// ═══════════════════════════════════════════════════
// The part picked for the exercise being added; the part being trained until the user picks another.
let modalPart = null;

function drawModalParts() {
  const box = document.getElementById('modal-parts');
  box.innerHTML = '';
  partIds().forEach(id => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'chip';
    chip.setAttribute('role', 'radio');
    chip.setAttribute('aria-checked', String(id === modalPart));
    chip.innerHTML = `${keyHtml(partColor(id))}${esc(routineName(id))}`;
    chip.onclick = () => { modalPart = id; drawModalParts(); };
    box.appendChild(chip);
  });
}

function openAddModal() {
  document.getElementById('modal-name').value = '';
  document.getElementById('modal-sets').value = '';
  modalPart = state.activeSession ? state.activeSession.routineKey : null;
  drawModalParts();
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-name').focus(), 100);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function confirmAddExercise() {
  const name = document.getElementById('modal-name').value.trim();
  const setsCount = parseInt(document.getElementById('modal-sets').value) || 0;
  if (!name || setsCount < 1) return;

  const ses = state.activeSession;
  if (!ses) return;

  const templateEx = state.routines[ses.routineKey].exercises.find(e => e.name === name);
  const sets = Array.from({ length: setsCount }, (_, i) => {
    if (templateEx && templateEx.sets[i]) {
      return withPrev({ weight: templateEx.sets[i].weight || 0, reps: templateEx.sets[i].reps || 0, restSeconds: null });
    }
    return { weight: 0, reps: 0, restSeconds: null };
  });

  const newExIdx = ses.exercises.length;
  const part = modalPart && modalPart !== ses.routineKey && state.routines[modalPart] ? modalPart : null;
  ses.exercises.push({ name, ...(part ? { part } : {}), note: templateEx ? templateEx.note || '' : '', sets });
  ses.currentSetCursors[newExIdx] = 0;

  save();
  closeModal();
  renderWorkout();

  setTimeout(() => {
    const card = document.getElementById(`exercise-card-${newExIdx}`);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 100);
}

document.getElementById('modal-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('modal-sets').focus();
});
document.getElementById('modal-sets').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmAddExercise();
});
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.getElementById('exercise-menu-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('exercise-menu-overlay')) closeExerciseMenu();
});
document.getElementById('end-confirm-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('end-confirm-overlay')) cancelEndWorkout();
});

// ═══════════════════════════════════════════════════
//  END WORKOUT
// ═══════════════════════════════════════════════════
function endWorkout() {
  document.getElementById('end-confirm-overlay').classList.add('open');
}

function cancelEndWorkout() {
  document.getElementById('end-confirm-overlay').classList.remove('open');
}

// Copy the active session into its routine as next time's template, then clear it.
// The workout also joins the upload queue for the cloud history.
function finishSession() {
  const ses = state.activeSession;
  let checkedIn = [];
  if (ses) {
    checkedIn = checkIn(ses);
    const routineKey = ses.routineKey;
    // The glass is only for this workout: last time's numbers stay out of the template and the history.
    const exercises = ses.exercises.map(ex => ({ ...ex, sets: ex.sets.map(({ prev, revealed, ...s }) => s) }));
    state.routines[routineKey].exercises = JSON.parse(JSON.stringify(exercises));
    state.routines[routineKey].lastTrainedAt = Date.now();
    queueWorkout({
      clientId: newId(),
      routineKey,
      startedAt: ses.startedAt,
      endedAt: Date.now(),
      exercises: JSON.parse(JSON.stringify(exercises))
    });
  }
  state.activeSession = null;
  save();
  return checkedIn;
}

// The part an exercise trains: the one it was given, else the part whose card it sits in.
function exercisePart(ex, routineKey) {
  return ex.part && state.routines[ex.part] ? ex.part : routineKey;
}

// Parts with an exercise whose every set is done, in exercise order. Only these count as trained.
function checkedInParts(ses) {
  const parts = [];
  ses.exercises.forEach((ex, i) => {
    if (!ex.sets.length || (ses.currentSetCursors[i] ?? 0) < ex.sets.length) return;
    const id = exercisePart(ex, ses.routineKey);
    if (!parts.includes(id)) parts.push(id);
  });
  return parts;
}

// Marks each such part as trained on the day the workout started. Returns them. Caller saves.
function checkIn(ses) {
  const day = isoOf(new Date(ses.startedAt));
  const parts = checkedInParts(ses);
  parts.forEach(id => {
    const days = state.logs[id] || (state.logs[id] = []);
    if (!days.includes(day)) days.push(day);
  });
  return parts;
}

function confirmEndWorkout() {
  const lit = finishSession();
  pendingLit = lit;
  announceSaved = true;
  stopTimers();
  const timerEl = document.getElementById('global-timer');
  if (timerEl) timerEl.textContent = '00:00:00';
  document.getElementById('end-confirm-overlay').classList.remove('open');
  window.location.hash = '';
  if (lit.length) toast(t('checkedIn', lit.map(routineName).join(t('join'))), lit.map(partColor));
  else toast(t('noCheckIn'));
}

//  EXERCISE MENU
// ═══════════════════════════════════════════════════
let activeMenuExIdx = null;

function openExerciseMenu(exIdx) {
  activeMenuExIdx = exIdx;
  document.getElementById('exercise-menu-overlay').classList.add('open');
}

function closeExerciseMenu() {
  activeMenuExIdx = null;
  document.getElementById('exercise-menu-overlay').classList.remove('open');
}

function renameExercisePrompt() {
  const ses = state.activeSession;
  const ex = ses.exercises[activeMenuExIdx];
  const next = prompt(t('renamePrompt'), ex.name);
  if (next && next.trim()) {
    ex.name = next.trim();
    save();
    renderWorkout();
  }
  closeExerciseMenu();
}

function deleteExerciseConfirm() {
  const ses = state.activeSession;
  const ex = ses.exercises[activeMenuExIdx];
  if (confirm(t('deleteExerciseConfirm', ex.name))) {
    ses.exercises.splice(activeMenuExIdx, 1);
    const newCursors = {};
    Object.keys(ses.currentSetCursors).forEach(k => {
      const i = parseInt(k);
      if (i !== activeMenuExIdx) {
        newCursors[i > activeMenuExIdx ? i - 1 : i] = ses.currentSetCursors[k];
      }
    });
    ses.currentSetCursors = newCursors;
    if (ses.restingState && ses.restingState.exerciseIndex === activeMenuExIdx) {
      ses.restingState = null;
    }
    save();
    renderWorkout();
  }
  closeExerciseMenu();
}
